
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'kwwhat'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'kwwhat'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


on-run-start:
  - |
    -- depends_on: {{ ref('stg_ocpp_logs') }}
    {{ claim_incremental_checkpoint() }}


on-run-end:
  - "{{ finalize_incremental_checkpoint(results) }}"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In dbt, the default materialization for a model is a view. This means, when you run 
# dbt run or dbt build, all of your models will be built as a view in your data platform. 
# The configuration below will override this setting for models in the example folder to 
# instead be materialized as tables. Any models you add to the root of the models folder will 
# continue to be built as views. These settings can be overridden in the individual model files
# using the `{{ config(...) }}` macro.

models:
  kwwhat:
    # Applies to all files under models/marts/
    marts:
      +materialized: table

# Variables for source references
# This makes it easier to reference sources in models and keeps source names consistent
# raw_database/raw_schema are deliberately NOT set here: their per-adapter defaults live in
# the source config in models/staging/raw/staging.yml (dbt_project.yml `vars` values aren't
# Jinja-rendered, so a target-aware default can't live here). Setting either var in this
# vars block would shadow that default on every adapter - override via --vars instead.
vars:
  ocpp_logs_identifier: "ocpp_1_6_synthetic_logs_14d"
  chargers_identifier: "chargers"
  ports_identifier: "ports"
  connectors_identifier: "connectors"
  # Start of every incremental window when the checkpoint is off (full refresh, dev, CI) and of the first
  # checkpoint window. Set it at or just before the first source log: windows are not moved to the data.
  start_processing_date: "2025-10-01"
  incremental_window:
    unit: "month"
    length: 3
  incremental_checkpoint_enabled: false
  incremental_checkpoint_name: "ocpp_incremental_pipeline"
  incremental_checkpoint_identifier: "_kwwhat_incremental_checkpoint"
  # How long a claimed window stays locked against other checkpoint runs. The lease is not renewed during a run,
  # so set it to roughly your longest full-DAG checkpoint run, times 2 to 3: shorter lets a second run claim the
  # same window mid-run, longer delays the retry after a crashed run.
  incremental_checkpoint_lease_minutes: 120



  success_energy_threshold_kwh: 0.1
  authorize_time_threshold_seconds: 300
  heartbeat_interval_seconds: 300
  transaction_message_retry_interval: 45
  message_type_ids:
    CALL: "2"
    CALLRESULT: "3"
    CALLERROR: "4"
  
