_schema_version: "0.12.0"  # written automatically by dct migrate
title: "kWwhat charging overview"
source: analytics

# Brand palette comes from charts/_brand.yml via charts/meta.yml.
# Pins keep each location on one hue (strong = authenticated, light tint = anonymous)
# and each outcome on a fixed color. New locations fall back to the palette.
style:
  charts:
    category_colors:
      chart_series:
        values:
          "LOC-001 / Authenticated": "#7C2167"
          "LOC-001 / Anonymous": "#F3DDEE"
          "LOC-002 / Authenticated": "#165255"
          "LOC-002 / Anonymous": "#D2F3F3"
          # Brand has no light Bluish; category[6] is Bluish in _brand.yml, .pale derives its tint.
          "LOC-003 / Authenticated": "#1F0D79"
          "LOC-003 / Anonymous": category[6].pale
      outcome:
        values:
          "First-attempt success": "#165255"
          "Troubled success": "#6AD8D6"
          "Failed": "#7C2167"
          "In progress": "#FFD72E"

# Shared visit end date filter, inclusive of both ends.
variables:
  date_range:
    input: daterange
    label: "Visit end date"
    default: ["2025-10-01", "2025-11-19"]

# Snowflake board reading the deployed mart, independent of the connection's write schema.
# Outcome and summary SQL mirror models/semantic/semantic_models.yml.
# Daily visits use the requested distinct-driver/anonymous-visit definition instead.
queries:
  daily_visits:
    sql: |
      with daily_counts as (
          select
              cast(visit_end_ts as date) as visit_date,
              location_id,
              count(distinct case when id_tag is not null then id_tag end) as authenticated_visits_count,
              count(distinct case when id_tag is null then visit_id end) as anonymous_visits_count
          from analytics.dbt_prod.fact_visits
          where {{ filter_date_range('visit_end_ts', date_range) }}
          group by cast(visit_end_ts as date), location_id
      ),
      visit_series as (
          select
              visit_date,
              location_id,
              'Authenticated' as authentication_type,
              authenticated_visits_count as visit_count
          from daily_counts
          union all
          select
              visit_date,
              location_id,
              'Anonymous' as authentication_type,
              anonymous_visits_count as visit_count
          from daily_counts
      )
      select
          to_char(visit_date, 'YYYY-MM-DD') as "visit_date",
          location_id as "location_id",
          authentication_type as "authentication_type",
          visit_count as "visit_count",
          location_id || ' / ' || authentication_type as "chart_series"
      from visit_series
      -- Authenticated first so it stacks at the bottom of each location, anonymous tint on top.
      order by visit_date, location_id, case when authentication_type = 'Authenticated' then 1 else 2 end

  visit_outcomes:
    sql: |
      select
          case
              when is_successful is null then 'In progress'
              when is_successful and charge_attempt_count = 1 then 'First-attempt success'
              when is_successful and charge_attempt_count > 1 then 'Troubled success'
              when not is_successful then 'Failed'
              else 'Unclassified'
          end as "outcome",
          count(visit_id) as "total_visits",
          -- Share of all visits, 0 to 1. Matches the semantic layer's ratio metrics
          -- (first_attempt_success_rate, troubled_success_rate, failed_rate): outcome visits / total_visits.
          1.0 * count(visit_id) / nullif(sum(count(visit_id)) over (), 0) as "visit_rate"
      from analytics.dbt_prod.fact_visits
      where {{ filter_date_range('visit_end_ts', date_range) }}
      group by 1
      order by 2 desc, 1
    formats:
      visit_rate: percent

  location_summary:
    sql: |
      select
          location_id as "location_id",
          count(visit_id) as "total_visits",
          count(case when is_successful and charge_attempt_count = 1 then visit_id end) as "first_attempt_success",
          count(case when is_successful and charge_attempt_count > 1 then visit_id end) as "troubled_success",
          count(case when not is_successful then visit_id end) as "failed_visits",
          count(case when is_successful is null then visit_id end) as "in_progress_visits",
          1.0 * sum(charge_attempt_count) / nullif(count(visit_id), 0) as "average_attempts_per_visit"
      from analytics.dbt_prod.fact_visits
      where {{ filter_date_range('visit_end_ts', date_range) }}
      group by 1
      order by 2 desc, 1

charts:
  daily_visits:
    type: bar
    query: daily_visits
    x: visit_date
    y: visit_count
    color: chart_series
    style:
      orientation: vertical
      # One stacked column per day; segments follow the query's
      # location then authentication order so each location stays together.
      stack: zero
      stack_order: data
      # Hide the series labels (legend or direct labels) beside the plot.
      key:
        visible: false
    title: "Daily visits by location"

  visit_outcomes:
    type: bar
    query: visit_outcomes
    x: outcome
    y: visit_rate
    color: outcome
    tooltip:
      - total_visits
    style:
      axis_y:
        scale:
          continuous:
            domain: [0, 1]
      # Outcome names are already on the axis, so the key is redundant.
      key:
        visible: false
    title: "Success rates"

  location_summary:
    type: table
    query: location_summary
    title: "Location summary (selected end dates)"

rows:
  - title: "Visits and outcomes"
    cols:
      - daily_visits
      - visit_outcomes
  - title: "Location detail"
    rows:
      - location_summary
