version: 2

# Legacy dbt Semantic Layer spec. Preserve public metric names and mart-owned outcome flags.
semantic_models:
  - name: chargers
    description: >
      One row per Charger. Current Type 1 commissioning and location attributes, not
      historical lifecycle state at a metric timestamp. Charger identity uses charger_id.
    model: ref('dim_chargers')
    entities:
      - name: charger
        type: primary
        expr: charger_id
    dimensions:
      - name: is_commissioned
        type: categorical
        description: "Current flag: decommissioned_ts is null. Not an as-of commissioning history."
      - name: location_id
        type: categorical
        description: "Current Charger location; use a fact's location entity for its stored location attribution."

  - name: ports
    description: >
      One row per Charger + Port (EVSE), keyed by port_key. A Port can charge one vehicle
      at a time and is the reliability grain. Current location is available through the
      charger entity; dim_ports has no location_id column.
    model: ref('dim_ports')
    entities:
      - name: port
        type: primary
        expr: port_key
      - name: charger
        type: foreign
        expr: charger_id
    dimensions:
      - name: charger_id
        type: categorical
        description: "Charger containing this Port; the Port identifier is only unique within that Charger."
      - name: port_id
        type: categorical
        description: "Natural Port identifier within its Charger, not a globally unique Port key."

  - name: connectors
    description: >
      One row per Charger + Port + Connector, keyed by connector_key. Current connector
      type, status, and resolved latest error; not event-time status history. Current
      location is available through the charger entity. Historical facts do not expose
      a connector foreign entity, so this is not an automatic connector-type slice of visits.
    model: ref('dim_connectors')
    entities:
      - name: connector
        type: primary
        expr: connector_key
      - name: charger
        type: foreign
        expr: charger_id
      - name: error_code
        type: foreign
        expr: latest_error_code_key
    dimensions:
      - name: connector_type
        type: categorical
        description: "Plug standard, such as CCS, NACS, CHAdeMO, Type1, or Type2."
      - name: latest_status
        type: categorical
        description: "Most recently reported OCPP status; null if no status has been received. Not historical status."
      - name: charger_id
        type: categorical
      - name: port_id
        type: categorical
        description: "Port containing this Connector, scoped to charger_id."
      - name: connector_id
        type: categorical
        description: "Connector identifier within the Charger/Port; use connector_key for global identity."

  - name: error_codes
    description: >
      Generic reference at taxonomy + error_code + error_code_name grain. Resolves the
      error entity for outage reasons and latest connector errors. Taxonomy identifies
      the code scheme, not the manufacturer; protocol and vendor names can overlap.
    model: ref('dim_error_codes')
    entities:
      - name: error_code
        type: primary
        expr: error_code_key
    dimensions:
      - name: taxonomy
        type: categorical
        description: "Code scheme: ocpp1.6 or a vendor taxonomy such as https://chargex.inl.gov."
      - name: error_code_name
        type: categorical
        description: "Human-readable error name; names alone do not uniquely identify errors across taxonomies."
      - name: vendor_error_code
        type: categorical
        expr: error_code
        description: "Short code within a vendor taxonomy, such as CX003; null for OCPP 1.6 dictionary rows."
      - name: description
        type: categorical
        description: "Reference explanation of the error condition, not a raw diagnostic message."

  - name: chargex_mrec_attributes
    description: >
      One row per ChargeX MREC code, sharing its unique error_code_key with error_codes.
      Supplies likely responsibility and functional-category flags for ChargeX codes only.
      Null joined flags for non-ChargeX errors mean unclassified, not false.
    model: ref('dim_chargex_mrec_attributes')
    primary_entity: error_code
    entities:
      - name: error_code
        type: unique
        expr: error_code_key
    dimensions:
      - name: fault_code
        type: categorical
        description: "ChargeX MREC code, such as CX003; unique within this ChargeX-only reference."
      - name: ocpp_1_6_error_code
        type: categorical
        description: "Equivalent standard OCPP 1.6 error name where defined; null when no equivalent exists."
      - name: responsible_ev_user
        type: categorical
      - name: responsible_cso
        type: categorical
      - name: responsible_evse
        type: categorical
      - name: responsible_ev
        type: categorical
      - name: is_safety
        type: categorical
      - name: is_security
        type: categorical
      - name: is_maintenance
        type: categorical
      - name: is_financial
        type: categorical
      - name: is_authorization
        type: categorical


  - name: visits
    description: >
      One row per driver stop at a location, including unidentified visits. A visit may
      span multiple attempts and Ports. Metrics use visit_end_ts and the last attempt's
      success flag. The charge_attempt and port entities refer to the last attempt and
      last Port only; do not interpret them as all hardware used during the visit.
    model: ref('fact_visits')
    defaults:
      agg_time_dimension: visit_end_ts
    entities:
      - name: visit
        type: primary
        expr: visit_id
      - name: charge_attempt
        type: foreign
        expr: last_charge_attempt_id
      - name: driver
        type: foreign
        expr: driver_key
      - name: location
        type: foreign
        expr: location_key
      - name: port
        type: foreign
        expr: last_port_key
    dimensions:
      - name: visit_end_ts
        type: time
        description: "Last attempt's stop timestamp; the default attribution time for visit metrics."
        type_params:
          time_granularity: day
      - name: visit_start_ts
        type: time
        description: "First attempt's start timestamp, not the default metric time."
        type_params:
          time_granularity: day
      - name: first_charger_id
        type: categorical
        description: "Charger where the visit started; a visit may use additional Chargers."
      - name: last_charger_id
        type: categorical
        description: "Charger where the visit's last attempt occurred."
      - name: is_first_attempt_success
        type: categorical
        description: "True for successful visits with exactly one attempt; not the first-attempt outcome of multi-attempt visits."
        expr: case when is_successful and charge_attempt_count = 1 then true else false end
      - name: is_troubled_success
        type: categorical
        description: "True for successful visits with more than one attempt."
        expr: case when is_successful and charge_attempt_count > 1 then true else false end
      - name: is_successful
        type: categorical
        description: "Authoritative mart flag: the last charge attempt in the visit was successful."
      - name: is_failed
        type: categorical
        description: "True when the visit's last attempt was unsuccessful."
        expr: case when is_successful then false else true end
      - name: last_error_code
        type: categorical
        description: "Most recent StatusNotification error across all attempts in the visit, not necessarily from the last attempt. Null if none occurred."
    measures:
      - name: visits_count
        description: "All visits, including unidentified visits, attributed to visit end time."
        agg: count
        expr: visit_id
      - name: energy_per_visit_kwh_average
        description: "Average total energy transferred per visit in kWh; an unpublished measure, not a named metric."
        agg: average
        expr: total_energy_transferred_kwh
      - name: charge_attempts_count
        description: "Sum of attempts belonging to visits, attributed to visit end time; not attempt starts by day."
        agg: sum
        expr: charge_attempt_count
      - name: successful_visits_count
        description: "Visits whose last attempt succeeded."
        agg: count
        expr: case when is_successful then visit_id end
      - name: visit_duration_minutes_average
        description: "Average elapsed visit duration in minutes, including time between attempts."
        agg: average
        expr: visit_duration_minutes
      - name: troubled_success_visits_count
        description: "Successful visits with more than one attempt."
        agg: count
        expr: case when is_successful and charge_attempt_count > 1 then visit_id end
      - name: troubled_success_count
        description: "Boolean count of successful multi-attempt visits; input to troubled_success."
        agg: sum_boolean
        expr: case when is_successful and charge_attempt_count > 1 then true else false end
      - name: charge_attempt_success_count
        description: "Legacy measure name: counts successful visits, not individual successful charge attempts."
        agg: sum_boolean
        expr: is_successful
      - name: first_attempt_success_visits_count
        description: "Successful visits with exactly one attempt."
        agg: count
        expr: case when is_successful and charge_attempt_count = 1 then visit_id end
      - name: first_attempt_success_count
        description: "Boolean count of successful single-attempt visits; input to first_attempt_success."
        agg: sum_boolean
        expr: case when is_successful and charge_attempt_count = 1 then true else false end
      - name: troubled_first_attempt_visits_count
        description: "Legacy measure name: successful visits with multiple attempts, not a distinct first-attempt outcome."
        agg: count
        expr: case when is_successful and charge_attempt_count > 1 then visit_id end
      - name: failed_visits_count
        description: "Visits whose last attempt was unsuccessful."
        agg: count
        expr: case when is_successful then null else visit_id end

  - name: charge_attempts
    description: >
      One row per charge attempt, including attempts without a transaction or known driver.
      Measures use charge_attempt_start_ts and the mart-owned success flag, which respects
      the configured energy threshold. Attempt measures are not independently published
      metrics here; total_charge_attempts is intentionally sourced from visits.
    model: ref('fact_charge_attempts')
    defaults:
      agg_time_dimension: charge_attempt_start_ts
    entities:
      - name: charge_attempt
        type: primary
        expr: charge_attempt_id
      - name: charger
        type: foreign
        expr: charger_id
      - name: port
        type: foreign
        expr: port_key
      - name: location
        type: foreign
        expr: location_key
    dimensions:
      - name: charge_attempt_start_ts
        type: time
        description: "Canonical attempt start; default metric time for attempt-level measures."
        type_params:
          time_granularity: day
      - name: charge_attempt_stop_ts
        type: time
        description: "Attempt stop timestamp; may be null for still-open attempts."
        type_params:
          time_granularity: day
      - name: is_successful
        type: categorical
        description: >
          Authoritative fact_charge_attempts flag, not a second success calculation.
          Requires a transaction, a non-Faulted ending status, a supported stop reason,
          and energy above success_energy_threshold_kwh (default 0.1 kWh).
      - name: next_status
        type: categorical
        description: "OCPP status following the attempt's Preparing interval, not the Connector's current status."
      - name: transaction_stop_reason
        type: categorical
        description: "StopTransaction reason associated with the attempt; null without a reported stop reason."
      - name: charger_id
        type: categorical
      - name: connector_id
        type: categorical
        description: "Connector business identifier on the attempt, not a conformed Connector entity join."
      - name: status
        type: categorical
        description: "Preparing status associated with the attempt, not current hardware status."
      - name: has_error
        type: categorical
        description: "At least one non-NoError StatusNotification occurred within the attempt window."
      - name: last_error_code
        type: categorical
        description: "Most recent qualifying OCPP StatusNotification error during the attempt; null when has_error is false."
    measures:
      - name: attempts_count
        description: "All charge attempts, attributed to attempt start time; differs from visit-based charge_attempts_count."
        agg: count
        expr: charge_attempt_id
      - name: successful_attempts_count
        description: "Attempts with the authoritative mart success flag set."
        agg: count
        expr: case when is_successful then charge_attempt_id end
      - name: attempt_success_rate
        description: "Legacy measure name: a successful-attempt count, not a ratio or a published rate metric."
        agg: sum_boolean
        expr: is_successful
      - name: energy_transferred_kwh_sum
        description: "Energy transferred across attempts in kWh, attributed to attempt start, not interval delivery time."
        agg: sum
        expr: energy_transferred_kwh
      - name: average_energy_per_attempt_kwh
        description: "Average non-null energy per attempt in kWh; includes unsuccessful attempts."
        agg: average
        expr: energy_transferred_kwh
      - name: average_energy_per_successful_attempt
        description: "Average non-null energy per successful attempt in kWh."
        agg: average
        expr: case when is_successful then energy_transferred_kwh end
      - name: failed_attempts_count
        description: "Attempts whose mart success flag is false."
        agg: count
        expr: case when is_successful then null else charge_attempt_id end
      - name: attempts_with_transaction_count
        description: "Attempts with an associated transaction, regardless of success."
        agg: count
        expr: case when transaction_id is not null then charge_attempt_id end
      - name: transaction_success_rate
        description: "Average success flag among attempts with transactions; not a directly published metric."
        agg: average
        expr: case when transaction_id is not null then cast(is_successful as integer) else null end

  - name: drivers
    description: >
      One row per observed id_tag credential plus an UNKNOWN sentinel, not resolved people.
      Current Type 1 first/last-seen and authorization attributes. Default metric time is
      first_seen_ts for acquisition counts; use driver_activity for historical active sets.
    model: ref('dim_drivers')
    defaults:
      agg_time_dimension: first_seen_ts
    entities:
      - name: driver
        type: primary
        expr: driver_key
    dimensions:
      - name: id_tag
        type: categorical
        description: "Observed credential identifier, or UNKNOWN for the unidentified-driver sentinel."
      - name: is_known_driver
        type: categorical
        description: "True for an observed driver credential; false for the UNKNOWN sentinel."
      - name: first_authorization_status
        type: categorical
        description: "Authorization status on the earliest observed attempt; not necessarily Accepted."
      - name: latest_authorization_status
        type: categorical
        description: "Latest observed authorization status, not historical status at a queried date."
      - name: first_seen_ts
        type: time
        description: "Earliest observed attempt start, limited by available source history; default acquisition time."
        type_params:
          time_granularity: day
      - name: last_seen_ts
        type: time
        description: "Latest observed attempt start. First/last seen alone cannot reconstruct historical activity."
        type_params:
          time_granularity: day
    measures:
      - name: drivers_count
        description: "Dimension rows including the UNKNOWN sentinel, grouped by first-seen time; not a human or active-driver count."
        agg: count
        expr: driver_key
      - name: known_drivers_count
        description: "Known credential rows grouped by first-seen time; new_drivers also excludes reserved unknown markers."
        agg: sum_boolean
        expr: is_known_driver


  - name: uptime
    description: >
      One row per commissioned Port and calendar day. Additive commissioned, uptime,
      and downtime minutes supply duration-weighted uptime_ratio at any roll-up grain.
      Do not average per-Port daily ratios. Use downtime_daily for outage-reason detail.
    model: ref('fact_uptime_daily')
    defaults:
      agg_time_dimension: date_id
    entities:
      - name: uptime_record
        type: primary
        expr: uptime_id
      - name: charger
        type: foreign
        expr: charger_id
      - name: port
        type: foreign
        expr: port_key
      - name: location
        type: foreign
        expr: location_key
    dimensions:
      - name: date_id
        type: time
        description: "Calendar date receiving the commissioned and outage minutes."
        type_params:
          time_granularity: day
      - name: charger_id
        type: categorical
      - name: port_id
        type: categorical
        description: "Natural Port identifier within charger_id."
    measures:
      - name: commissioned_minutes_total
        description: "Commissioned Port minutes, including partial first/last days. Denominator for duration-weighted uptime."
        agg: sum
        expr: commissioned_minutes
      - name: uptime_minutes_total
        description: "Commissioned Port minutes not lost to outages. Numerator for duration-weighted uptime."
        agg: sum
        expr: uptime_minutes
      - name: downtime_minutes_total
        description: "OFFLINE + FAULTED Port-day minutes. Use the detailed counterpart to slice by reason; never add the two totals together."
        agg: sum
        expr: downtime_minutes
      - name: offline_downtime_minutes_total
        description: "Port downtime minutes caused by missing Charger heartbeats; a measure, not an independently published metric."
        agg: sum
        expr: offline_downtime_minutes
      - name: faulted_downtime_minutes_total
        description: "Port downtime minutes caused by reported faults; a measure, not an independently published metric."
        agg: sum
        expr: faulted_downtime_minutes

  - name: downtime_daily
    description: >
      One row per date_id + outage_id, retaining the affected Port, outage type, reason,
      and latest resolved error key. OFFLINE means missing heartbeats; FAULTED means a
      reported Port fault. Reasons include NoHeartbeat, resolved fault names, NoError,
      and UnknownError. Diagnose lost minutes here; use uptime for headline reliability.
      Error classification describes the outage's latest resolved code, not event-by-event
      error history. Reconcile totals with uptime at aligned processing coverage and scope.
    model: ref('fact_downtime_daily')
    defaults:
      agg_time_dimension: date_id
    entities:
      - name: downtime_record
        type: primary
        expr: downtime_id
      - name: port
        type: foreign
        expr: port_key
      - name: location
        type: foreign
        expr: location_key
      - name: error_code
        type: foreign
        expr: latest_error_code_key
    dimensions:
      - name: date_id
        type: time
        description: "Calendar date receiving this outage's minutes; one outage can span several dates."
        type_params:
          time_granularity: day
      - name: charger_id
        type: categorical
      - name: port_id
        type: categorical
      - name: downtime_type
        type: categorical
        description: "OFFLINE for missing heartbeats or FAULTED for a reported Port fault."
      - name: reason
        type: categorical
        description: "Resolved outage reason; use the error_code entity for taxonomy and reference explanation."
    measures:
      - name: downtime_minutes_detailed_total
        description: "Outage-day minutes for diagnosis by type, reason, and error classification. A detailed counterpart of uptime's downtime total."
        agg: sum
        expr: duration_minutes

  - name: locations
    description: "One row per conformed charging location, keyed by location_key. Current Type 1 reference attributes."
    model: ref('dim_locations')
    entities:
      - name: location
        type: primary
        expr: location_key
    dimensions:
      - name: location_id
        type: categorical
        description: "Natural location identifier shared by visit, attempt, uptime, and downtime location entities."

  - name: driver_activity
    description: >
      Sparse network-wide activity at identified credential + active calendar date grain.
      Any charge attempt establishes presence, regardless of success. Null, UNKNOWN, and
      __UNKNOWN__ identifiers are excluded upstream. Count distinct drivers across the
      entire rolling window; daily counts must not be summed. No location/Port entity is
      defined. Use completed, fully ingested as-of dates and sufficient lookback history.
    model: ref('fact_driver_activity_daily')
    defaults:
      agg_time_dimension: date_id
    entities:
      - name: driver_activity_record
        type: primary
        expr: driver_activity_id
      - name: driver
        type: foreign
        expr: driver_key
    dimensions:
      - name: date_id
        type: time
        description: "Calendar date cast from canonical charge_attempt_start_ts, without an additional timezone conversion."
        type_params:
          time_granularity: day
    measures:
      - name: active_drivers_distinct
        description: "Distinct observed credentials with any activity across the requested window, not resolved humans. Non-additive across dates."
        agg: count_distinct
        expr: driver_key

metrics:
  - name: total_visits
    description: "All visits, including unidentified visits, attributed to visit end time."
    label: "Visits count"
    type: simple
    type_params:
      measure: visits_count

  - name: total_successful_visits
    description: "Visits whose last charge attempt succeeded, on a single attempt or after retries. Attributed to visit end time."
    label: "Total successful visits"
    type: simple
    type_params:
      measure: successful_visits_count

  - name: total_charge_attempts
    description: "Sum of attempts belonging to visits, attributed to visit_end_ts. Not an independent count of all attempts by charge_attempt_start_ts."
    label: "Total charge attempts"
    type: simple
    type_params:
      measure: charge_attempts_count

  - name: average_attempts_per_visit
    description: "Attempts belonging to visits divided by visit count, attributed to visit end time. Measures retry effort, not attempt success."
    label: "Average attempts per visit"
    type: ratio
    type_params:
      numerator: total_charge_attempts
      denominator: total_visits

  - name: first_attempt_success
    description: "Successful visits with exactly one attempt. Does not inspect the first-attempt outcome of multi-attempt visits."
    label: "First attempt success count"
    type: simple
    type_params:
      measure: first_attempt_success_count

  - name: troubled_success
    description: "Successful visits with multiple attempts; success is determined by the last attempt."
    label: "Troubled success count"
    type: simple
    type_params:
      measure: troubled_success_count

  - name: failed_visits
    description: "Visits whose last charge attempt was unsuccessful, regardless of earlier attempts."
    label: "Failed visits count"
    type: simple
    type_params:
      measure: failed_visits_count

  - name: first_attempt_success_rate
    description: "Successful single-attempt visits divided by all visits, including unidentified visits. Visit-end time attribution."
    label: "First attempt success rate"
    type: ratio
    type_params:
      numerator: first_attempt_success
      denominator: total_visits

  - name: troubled_success_rate
    description: "Successful multi-attempt visits divided by all visits, including unidentified visits. Visit-end time attribution."
    label: "Troubled success rate"
    type: ratio
    type_params:
      numerator: troubled_success
      denominator: total_visits

  - name: failed_rate
    description: "Visits whose last attempt was unsuccessful divided by all visits, including unidentified visits. Visit-end time attribution."
    label: "Failed rate"
    type: ratio
    type_params:
      numerator: failed_visits
      denominator: total_visits

  - name: total_commissioned_minutes
    description: "Commissioned Port minutes, including partial first/last days, summed over the period. Uptime denominator."
    label: "Total commissioned minutes"
    type: simple
    type_params:
      measure: commissioned_minutes_total

  - name: total_uptime_minutes
    description: "Commissioned Port minutes not lost to outages: total_commissioned_minutes minus total_downtime_minutes. Uptime numerator."
    label: "Total uptime minutes"
    type: simple
    type_params:
      measure: uptime_minutes_total

  - name: uptime_ratio
    description: >
      Duration-weighted Port reliability: total_uptime_minutes / total_commissioned_minutes.
      Roll up minute totals across Ports and dates, never average daily ratios. Partial
      commissioning days contribute only their commissioned minutes. No ratio is defined
      for a zero commissioned-time denominator. Diagnose losses with total_downtime_minutes_detailed.
    label: "Uptime ratio"
    type: ratio
    type_params:
      numerator: total_uptime_minutes
      denominator: total_commissioned_minutes

  - name: total_downtime_minutes
    description: "OFFLINE + FAULTED Port-day minutes from uptime, by Port, Charger, location, and date. Use the detailed metric for reason/error slices; do not add the two totals together."
    label: "Total downtime minutes"
    type: simple
    type_params:
      measure: downtime_minutes_total

  - name: total_downtime_minutes_detailed
    description: >
      Outage-day downtime minutes, sliceable by downtime_type, reason, and resolved
      protocol/vendor error classification. Detailed counterpart of total_downtime_minutes,
      not an additional quantity. Reconcile with aligned scope and processing coverage.
    label: "Total downtime minutes (detailed)"
    type: simple
    type_params:
      measure: downtime_minutes_detailed_total


  - name: new_drivers
    description: >
      Identified drivers first observed on metric_time, using dim_drivers.first_seen_ts.
      For daily overlapping-window accounting this is the new entrant count for both
      7-day and 30-day windows, not all acquisitions within those trailing windows.
    label: "New drivers"
    type: simple
    filter: "{{ Dimension('driver__id_tag') }} not in ('UNKNOWN', '__UNKNOWN__')"
    type_params:
      measure:
        name: known_drivers_count
        fill_nulls_with: 0
        join_to_timespine: true

  - name: active_drivers_7d
    description: "Distinct identified drivers active on D-6 through D inclusive. Query metric_time__day; use completed, fully ingested as-of dates. Coarser queries select the last daily snapshot."
    label: "7-day active drivers"
    type: cumulative
    type_params:
      measure:
        name: active_drivers_distinct
        fill_nulls_with: 0
        join_to_timespine: true
      cumulative_type_params:
        window: 7 days
        period_agg: last

  - name: active_drivers_30d
    description: "Distinct identified drivers active on D-29 through D inclusive. Fixed 30 days, not a calendar month. Query metric_time__day; use completed, fully ingested as-of dates. Coarser queries select the last daily snapshot."
    label: "30-day active drivers"
    type: cumulative
    type_params:
      measure:
        name: active_drivers_distinct
        fill_nulls_with: 0
        join_to_timespine: true
      cumulative_type_params:
        window: 30 days
        period_agg: last

  - name: driver_activity_union_8d
    description: "Accounting helper: distinct drivers on D-7 through D, the union of today's and yesterday's trailing 7-day active sets. Not a headline engagement metric."
    label: "Driver activity union (8 days, helper)"
    type: cumulative
    type_params:
      measure:
        name: active_drivers_distinct
        fill_nulls_with: 0
        join_to_timespine: true
      cumulative_type_params:
        window: 8 days
        period_agg: last

  - name: driver_activity_union_31d
    description: "Accounting helper: distinct drivers on D-30 through D, the union of today's and yesterday's trailing 30-day active sets. Not a headline engagement metric."
    label: "Driver activity union (31 days, helper)"
    type: cumulative
    type_params:
      measure:
        name: active_drivers_distinct
        fill_nulls_with: 0
        join_to_timespine: true
      cumulative_type_params:
        window: 31 days
        period_agg: last

  - name: retained_drivers_7d
    description: "Drivers in both D-6..D and D-7..D-1 active sets. Does not require charging on D. Daily as-of accounting only; do not sum over dates."
    label: "Retained drivers (7-day window)"
    type: derived
    type_params:
      expr: current_active + previous_active - union_active
      metrics:
        - name: active_drivers_7d
          alias: current_active
        - name: active_drivers_7d
          alias: previous_active
          offset_window: 1 day
        - name: driver_activity_union_8d
          alias: union_active

  - name: retained_drivers_30d
    description: "Drivers in both D-29..D and D-30..D-1 active sets. Does not require charging on D. Daily as-of accounting only; do not sum over dates."
    label: "Retained drivers (30-day window)"
    type: derived
    type_params:
      expr: current_active + previous_active - union_active
      metrics:
        - name: active_drivers_30d
          alias: current_active
        - name: active_drivers_30d
          alias: previous_active
          offset_window: 1 day
        - name: driver_activity_union_31d
          alias: union_active

  - name: resurrected_drivers_7d
    description: "Drivers entering the trailing 7-day active set on D who were first seen before D and absent from yesterday's set. Daily as-of accounting only; requires aligned first-seen and activity history."
    label: "Resurrected drivers (7-day window)"
    type: derived
    type_params:
      expr: current_active - retained - new_entrants
      metrics:
        - name: active_drivers_7d
          alias: current_active
        - name: retained_drivers_7d
          alias: retained
        - name: new_drivers
          alias: new_entrants

  - name: resurrected_drivers_30d
    description: "Drivers entering the trailing 30-day active set on D who were first seen before D and absent from yesterday's set. Daily as-of accounting only; requires aligned first-seen and activity history."
    label: "Resurrected drivers (30-day window)"
    type: derived
    type_params:
      expr: current_active - retained - new_entrants
      metrics:
        - name: active_drivers_30d
          alias: current_active
        - name: retained_drivers_30d
          alias: retained
        - name: new_drivers
          alias: new_entrants

  - name: churned_drivers_7d
    description: "Drivers in yesterday's trailing 7-day active set but not today's. Their last activity was D-7. Window expiry, not evidence of permanent churn. Daily as-of accounting only."
    label: "Churned drivers (7-day window)"
    type: derived
    type_params:
      expr: previous_active - retained
      metrics:
        - name: active_drivers_7d
          alias: previous_active
          offset_window: 1 day
        - name: retained_drivers_7d
          alias: retained

  - name: churned_drivers_30d
    description: "Drivers in yesterday's trailing 30-day active set but not today's. Their last activity was D-30. Window expiry, not evidence of permanent churn. Daily as-of accounting only."
    label: "Churned drivers (30-day window)"
    type: derived
    type_params:
      expr: previous_active - retained
      metrics:
        - name: active_drivers_30d
          alias: previous_active
          offset_window: 1 day
        - name: retained_drivers_30d
          alias: retained


  - name: drivers_observed_to_date
    description: >
      Supporting lifecycle population: identified driver credentials first observed on or
      before D, using dim_drivers.first_seen_ts. Excludes future acquisitions and reserved
      unknown markers. All-time accumulation, not the current dimension row count.
      Query metric_time__day with complete, aligned first-seen and activity history.
    label: "Drivers observed to date (helper)"
    type: cumulative
    filter: "{{ Dimension('driver__id_tag') }} not in ('UNKNOWN', '__UNKNOWN__')"
    type_params:
      measure:
        name: known_drivers_count
        fill_nulls_with: 0
        join_to_timespine: true
      cumulative_type_params:
        period_agg: last

  - name: mad
    description: >
      Monthly active drivers: distinct identified credentials with any charge attempt
      on D-29 through D inclusive. A fixed 30-day window, not a calendar month.
      MAD equals MAD New + MAD retained + MAD resurrected. Query metric_time__day;
      use completed, fully ingested dates with sufficient prehistory.
    label: "MAD"
    type: derived
    type_params:
      expr: active
      metrics:
        - name: active_drivers_30d
          alias: active

  - name: mad_new
    description: >
      Identified drivers first observed on D. Daily entrant count, not acquisitions
      across the whole trailing month. Active lifecycle category; mutually exclusive
      with MAD retained and MAD resurrected. Query metric_time__day.
    label: "MAD New"
    type: derived
    type_params:
      expr: new_entrants
      metrics:
        - name: new_drivers
          alias: new_entrants

  - name: mad_retained
    description: >
      Identified drivers active in both D-29..D and D-30..D-1. Includes drivers first
      observed earlier in the trailing month; activity on D is not required.
      Active lifecycle category. Query metric_time__day; do not sum across dates.
    label: "MAD retained"
    type: derived
    type_params:
      expr: retained
      metrics:
        - name: retained_drivers_30d
          alias: retained

  - name: mad_resurrected
    description: >
      Identified drivers active in D-29..D, absent from D-30..D-1, and first observed
      before D. Active lifecycle category. A return on D after last activity on D-30
      is retained, not resurrected. Query metric_time__day.
    label: "MAD resurrected"
    type: derived
    type_params:
      expr: resurrected
      metrics:
        - name: resurrected_drivers_30d
          alias: resurrected

  - name: mad_churned
    description: >
      Identified drivers active in D-30..D-1 but absent from D-29..D. Their last activity
      was D-30. Inactive lifecycle category, outside MAD; window expiry does not imply
      permanent churn. Drivers become stale the next day unless they return.
      Query metric_time__day.
    label: "MAD churned"
    type: derived
    type_params:
      expr: churned
      metrics:
        - name: churned_drivers_30d
          alias: churned

  - name: mad_stale
    description: >
      Identified drivers first observed by D but inactive in both D-29..D and D-30..D-1.
      Last activity was before D-30. Inactive lifecycle category, outside MAD.
      The five lifecycle categories partition drivers_observed_to_date on each day.
      Query metric_time__day with complete, aligned history; do not sum across dates.
    label: "MAD stale"
    type: derived
    type_params:
      expr: known_to_date - union_active
      metrics:
        - name: drivers_observed_to_date
          alias: known_to_date
        - name: driver_activity_union_31d
          alias: union_active
