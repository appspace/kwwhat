version: 2

models:
  - name: int_offline_outages
    description: "Intermediate incremental model that detects offline outages for charge points by identifying periods longer than heartbeat_interval_seconds without any charge point initiated messages (CALL messages). Grain: one row per charger_id + from_ts outage start."
    columns:
      - name: charger_id
        description: "Identifier for the charge point that experienced the outage"
        data_tests:
          - not_null
      - name: from_ts
        description: "Timestamp when the outage period started (beginning of the quiet period without communication)"
        data_tests:
          - not_null
      - name: to_ts
        description: "Timestamp when the outage period ended (when communication resumed or monitoring period ended)"
        data_tests:
          - not_null
      - name: duration_minutes
        description: "Duration of the outage in minutes (calculated from from_ts to to_ts). Only outages longer than heartbeat_interval_seconds are included."
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - charger_id
              - from_ts

  - name: int_faulted_outages
    description: "Intermediate incremental model that detects port-level faulted outages by aggregating connector fault periods. Only periods where ALL connectors for a port are simultaneously faulted are considered outages. Grain: one row per charger_id + port_id + from_ts outage start."
    columns:
      - name: charger_id
        description: "Identifier for the charge point that experienced the faulted outage"
        data_tests:
          - not_null
      - name: port_id
        description: "Identifier for the port that experienced the faulted outage (all connectors on this port were faulted during the outage period)"
        data_tests:
          - not_null
      - name: from_ts
        description: "Timestamp when the faulted outage period started (when all connectors for the port became faulted)"
        data_tests:
          - not_null
      - name: to_ts
        description: "Timestamp when the faulted outage period ended (when at least one connector recovered from faulted status)"
        data_tests:
          - not_null
      - name: duration_minutes
        description: "Duration of the faulted outage in minutes (calculated from from_ts to to_ts). Only periods where all connectors for the port are faulted are included."
        data_tests:
          - not_null
      - name: error_codes
        description: "Distinct OCPP error codes (e.g. 'OtherError', 'GroundFailure') reported by any connector on this port while faulted during the outage. error_code is a required OCPP field, always populated on the source, unlike the vendor-specific fields below. For root-cause detail scoped to a specific vendor's fault-code scheme, see vendor_error_codes/vendor_ids."
      - name: vendor_error_codes
        description: "Distinct vendor-specific fault codes (e.g. ChargeX MREC 'CX003' for HighTemperature) reported by any connector on this port while faulted during the outage. Empty array if no connector reported a vendor error code (vendor doesn't populate it, or the notification that triggered the fault carried no vendorErrorCode). Meaning depends on the fault-code scheme - decode via dim_error_codes scoped to vendor_ids, not by fault_code alone."
      - name: vendor_ids
        description: "Distinct vendor-specific fault-code schemes (e.g. ChargeX's 'https://chargex.inl.gov') reported alongside vendor_error_codes by any connector on this port while faulted during the outage. Scopes how vendor_error_codes should be decoded via dim_error_codes - see dim_connectors.latest_taxonomy. Expected to hold at most one value: a port's connectors are all the same OEM/scheme, so more than one distinct vendor_id here signals a data quality issue, not a legitimate multi-vendor port - checked by tests/assert_faulted_outage_single_vendor_id.sql."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - charger_id
              - port_id
              - from_ts
