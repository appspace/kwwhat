version: 2

models:
  - name: int_offline_outages
    description: "Intermediate incremental model that detects offline outages for charge points by identifying periods longer than heartbeat_interval_seconds without any charge point initiated messages (CALL messages). Grain: one row per charger_id + from_ts outage start."
    columns:
      - name: charger_id
        description: "Identifier for the charge point that experienced the outage"
        data_tests:
          - not_null
      - name: from_ts
        description: "Timestamp when the outage period started (beginning of the quiet period without communication)"
        data_tests:
          - not_null
      - name: to_ts
        description: "Timestamp when the outage period ended (when communication resumed or monitoring period ended)"
        data_tests:
          - not_null
      - name: duration_minutes
        description: "Duration of the outage in minutes (calculated from from_ts to to_ts). Only outages longer than heartbeat_interval_seconds are included."
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - charger_id
              - from_ts

  - name: int_faulted_outages
    description: "Intermediate incremental model that detects port-level faulted outages by aggregating connector fault periods. Only periods where ALL connectors for a port are simultaneously faulted are considered outages. Grain: one row per charger_id + port_id + from_ts outage start."
    columns:
      - name: charger_id
        description: "Identifier for the charge point that experienced the faulted outage"
        data_tests:
          - not_null
      - name: port_id
        description: "Identifier for the port that experienced the faulted outage (all connectors on this port were faulted during the outage period)"
        data_tests:
          - not_null
      - name: from_ts
        description: "Timestamp when the faulted outage period started (when all connectors for the port became faulted)"
        data_tests:
          - not_null
      - name: to_ts
        description: "Timestamp when the faulted outage period ended (when at least one connector recovered from faulted status)"
        data_tests:
          - not_null
      - name: duration_minutes
        description: "Duration of the faulted outage in minutes (calculated from from_ts to to_ts). Only periods where all connectors for the port are faulted are included."
        data_tests:
          - not_null
      - name: latest_error_code_name
        description: "Standard OCPP 1.6 error code (errorCode, e.g. 'OtherError', 'GroundFailure') from whichever connector fault period started most recently during this outage. Matches dim_error_codes.error_code_name for taxonomy 'ocpp1.6'. Carried forward as fact_downtime_daily.latest_error_code_name."
      - name: latest_error_code
        description: "Vendor-specific fault code (vendorErrorCode, e.g. ChargeX MREC 'CX003' for HighTemperature) from whichever connector fault period started most recently during this outage. Null if the vendor doesn't report one. Meaning depends on the fault-code scheme - decode via dim_error_codes on (latest_taxonomy, latest_error_code). Carried forward as fact_downtime_daily.latest_error_code."
      - name: latest_taxonomy
        description: "Vendor-specific fault-code scheme (vendorId, e.g. ChargeX's 'https://chargex.inl.gov') paired with latest_error_code, scoping how it should be decoded - see dim_error_codes.taxonomy. Not the charger's OEM/manufacturer. Null if the vendor doesn't populate it."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - charger_id
              - port_id
              - from_ts
