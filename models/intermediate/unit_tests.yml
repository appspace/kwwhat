    expect:
      rows:
        - {charger_id: 'CH-001', from_ts: '2025-10-01 10:00:00', to_ts: '2025-10-01 11:30:00', incremental_ts: '2025-10-01 11:30:00'}

  # ── int_connector_preparing ─────────────────────────────────────────────────

  - name: test_connector_preparing_incremental_merge_updates_next_status
    description: >
      In incremental mode, a buffered Preparing row whose next_status is null
      should be updated when the new run's int_status_changes now contains the
      subsequent status transition. Also verifies that once next_ingested_ts
      becomes known, event chaining (preparing_events_chaining) picks up a
      StartTransaction + confirmation pair that falls within the newly-known
      (ingested_ts, next_ingested_ts] window, and transaction_id gets populated
      from it - not just next_status/incremental_ts. And that updated_ts (this
      model's own per-row "last touched" signal, distinct from incremental_ts)
      advances from the buffered to greatest() of the buffered value and this 
      run's newly-known next_ingested_ts.
    model: int_connector_preparing
    overrides:
      macros:
        is_incremental: true
    given:
      - input: this
        format: dict
        rows:
          - {
              charger_id: 'CH-001',
              connector_id: '1',
              unique_id: 'UID-001',
              ingested_ts: 2025-10-01 10:00:00,
              status: 'Preparing',
              next_status: null,
              next_ingested_ts: null,
              incremental_ts: 2025-10-01 10:00:00,
              updated_ts: 2025-10-01 10:00:00,
            }
      - input: ref('int_status_changes')
        format: dict
        rows:
          - {
              charger_id: 'CH-001',
              connector_id: '1',
              unique_id: 'UID-001',
              ingested_ts: 2025-10-01 10:00:00,
              status: 'Preparing',
              next_status: 'Charging',
              next_ingested_ts: 2025-10-01 10:10:00,
              incremental_ts: 2025-10-01 10:10:00,
              updated_ts: 2025-10-01 10:10:00,
            }
      - input: ref('int_ocpp_logs')
        format: dict
        rows:
          # StartTransaction request, falling inside the (ingested_ts, next_ingested_ts]
          # window that only becomes valid this run, now that next_ingested_ts is known.
          - {
              charger_id: 'CH-001',
              connector_id: '1',
              action: 'StartTransaction',
              ingested_timestamp: 2025-10-01 10:00:05,
              message_type_id: '2',
              unique_id: 'start-001',
              payload: '{}',
            }
          # Its CALLRESULT confirmation, carrying the transactionId.
          - {
              charger_id: 'CH-001',
              ingested_timestamp: 2025-10-01 10:00:06,
              message_type_id: '3',
              unique_id: 'start-001',
              payload: '{"transactionId": 1001}',
            }
    expect:
      rows:
        - {
            charger_id: 'CH-001',
            connector_id: '1',
            status: 'Preparing',
            next_status: 'Charging',
            incremental_ts: '2025-10-01 10:10:00',
            updated_ts: '2025-10-01 10:10:00',
            transaction_id: '1001',
            _unique_transaction_count: 1,
          }

  - name: test_connector_preparing_buffer_captures_event_within_30_min_window
    description: >
      from_timestamp (the buffered row's own incremental_ts - the table-wide max as
      of the last run) is 10:00:00, so buffer_from_timestamp is 09:30:00. The buffered
      Preparing row's own ingested_ts (09:45:00, when it actually happened) falls
      inside that 30-minute lookback, so status_changes_to_preparing re-scans it and
      the buffer-merge correctly picks up its now-known next_status.
    model: int_connector_preparing
    overrides:
      macros:
        is_incremental: true
    given:
      - input: this
        rows:
          - {charger_id: 'CH-001', connector_id: '1', unique_id: 'UID-001', ingested_ts: 2025-10-01 09:45:00, status: 'Preparing', next_status: null, incremental_ts: 2025-10-01 10:00:00}
      - input: ref('int_status_changes')
        rows:
          - {charger_id: 'CH-001', connector_id: '1', unique_id: 'UID-001', ingested_ts: 2025-10-01 09:45:00, status: 'Preparing', next_status: 'Charging', next_ingested_ts: 2025-10-01 09:55:00, incremental_ts: 2025-10-01 09:55:00}
      - input: ref('int_ocpp_logs')
        rows:
          # Only needed so the model's own least()-bounded to_timestamp has a
          # non-null max(ingested_timestamp) to read from this source too.
          - {ingested_timestamp: 2025-10-01 09:55:00}
    expect:
      rows:
        - {charger_id: 'CH-001', connector_id: '1', status: 'Preparing', next_status: 'Charging'}

  - name: test_connector_preparing_buffer_ignores_event_outside_30_min_window
    description: >
      Same from_timestamp/buffer_from_timestamp as the within-window test (10:00:00 /
      09:30:00), but the buffered Preparing row's own ingested_ts (09:20:00) falls
      outside that 30-minute lookback. status_changes_to_preparing never re-scans it,
      so this run produces no output row at all for it - not updated, not duplicated,
      just silently left as-is in the underlying table.
    model: int_connector_preparing
    overrides:
      macros:
        is_incremental: true
    given:
      - input: this
        rows:
          - {charger_id: 'CH-001', connector_id: '1', unique_id: 'UID-001', ingested_ts: 2025-10-01 09:20:00, status: 'Preparing', next_status: null, incremental_ts: 2025-10-01 10:00:00}
      - input: ref('int_status_changes')
        rows:
          - {charger_id: 'CH-001', connector_id: '1', unique_id: 'UID-001', ingested_ts: 2025-10-01 09:20:00, status: 'Preparing', next_status: 'Charging', next_ingested_ts: 2025-10-01 09:30:00, incremental_ts: 2025-10-01 09:30:00}
      - input: ref('int_ocpp_logs')
        rows:
          # Only needed so the model's own least()-bounded to_timestamp has a
          # non-null max(ingested_timestamp) to read from this source too.
          - {ingested_timestamp: 2025-10-01 09:30:00}
    expect:
      rows: []

  # ── int_transactions ────────────────────────────────────────────────────────

  - name: test_transactions_incremental_ts_advances_on_transaction_completion
    description: >
      incremental_ts is max(ingested_ts) over ALL raw ocpp_logs scanned this run
      (unlike int_connector_preparing, this scan isn't pre-filtered to one action
      type), so it correctly advances to the StopTransaction event's own timestamp
      even though the transaction row's own ingested_ts (min() across its events)
      stays anchored to the StartTransaction time. updated_ts (this model's own
      per-row "last touched" signal, distinct from incremental_ts) also advances,
      from the buffered 10:01:00 to 10:29:00 - greatest() of the buffered value
      and this run's newest event (the StopTransaction itself).
    model: int_transactions
    overrides:
      macros:
        is_incremental: true
    given:
      - input: this
        rows:
          - {charger_id: 'CH-001', transaction_id: 'TXN-001', transaction_stop_ts: null, meter_start_wh: 1000, incremental_ts: 2025-10-01 10:01:00, updated_ts: 2025-10-01 10:01:00}
      - input: ref('int_ocpp_logs')
        rows:
