version: 2

unit_tests:

  # ── int_driver_aggregates ───────────────────────────────────────────────────

  - name: test_int_driver_aggregates_late_arriving_event_updates_first_seen
    description: "A late-arriving event with an earlier charge_attempt_start_ts must overwrite first_seen_ts and first_authorization_status."
    model: int_driver_aggregates
    overrides:
      macros:
        is_incremental: true
      vars:
        start_processing_date: '2025-10-01 00:00:00'
    given:
      - input: this
        format: dict
        rows:
          - {id_tag: 'TAG-001', first_seen_ts: 2025-10-02 11:00:00, last_seen_ts: 2025-10-02 12:00:00, first_authorization_status: 'Accepted', latest_authorization_status: 'Blocked', incremental_ts: 2025-10-02 12:00:00}
      - input: ref('fact_charge_attempts')
        format: dict
        rows:
          - {id_tag: 'TAG-001', id_tag_status: 'Invalid', charge_attempt_start_ts: 2025-10-02 09:00:00, incremental_ts: 2025-10-02 13:00:00}
    expect:
      rows:
        - {id_tag: 'TAG-001', first_seen_ts: 2025-10-02 09:00:00, last_seen_ts: 2025-10-02 12:00:00, first_authorization_status: 'Invalid', latest_authorization_status: 'Blocked'}

  - name: test_int_driver_aggregates_new_latest_event_updates_last_seen
    description: "A new event with a later charge_attempt_start_ts must overwrite last_seen_ts and latest_authorization_status."
    model: int_driver_aggregates
    overrides:
      macros:
        is_incremental: true
      vars:
        start_processing_date: '2025-10-01 00:00:00'
    given:
      - input: this
        format: dict
        rows:
          - {id_tag: 'TAG-001', first_seen_ts: 2025-10-02 11:00:00, last_seen_ts: 2025-10-02 12:00:00, first_authorization_status: 'Accepted', latest_authorization_status: 'Accepted', incremental_ts: 2025-10-02 12:00:00}
      - input: ref('fact_charge_attempts')
        format: dict
        rows:
          - {id_tag: 'TAG-001', id_tag_status: 'Blocked', charge_attempt_start_ts: 2025-10-02 14:00:00, incremental_ts: 2025-10-02 15:00:00}
    expect:
      rows:
        - {id_tag: 'TAG-001', first_seen_ts: 2025-10-02 11:00:00, last_seen_ts: 2025-10-02 14:00:00, first_authorization_status: 'Accepted', latest_authorization_status: 'Blocked'}

  - name: test_int_driver_aggregates_unknown_sentinel_accumulates_incremental
    description: "Null id_tag rows aggregate under __UNKNOWN__ and merge correctly with the existing sentinel on incremental runs."
    model: int_driver_aggregates
    overrides:
      macros:
        is_incremental: true
      vars:
        start_processing_date: '2025-10-01 00:00:00'
    given:
      - input: this
        format: dict
        rows:
          - {id_tag: '__UNKNOWN__', first_seen_ts: 2025-10-02 08:00:00, last_seen_ts: 2025-10-02 09:00:00, first_authorization_status: null, latest_authorization_status: null, incremental_ts: 2025-10-02 09:00:00}
      - input: ref('fact_charge_attempts')
        format: dict
        rows:
          - {id_tag: null, id_tag_status: null, charge_attempt_start_ts: 2025-10-02 07:00:00, incremental_ts: 2025-10-02 13:00:00}
    expect:
      rows:
        - {id_tag: '__UNKNOWN__', first_seen_ts: 2025-10-02 07:00:00, last_seen_ts: 2025-10-02 09:00:00, first_authorization_status: null, latest_authorization_status: null}

  # ── int_status_changes ──────────────────────────────────────────────────────

  - name: test_status_changes_deduplicates_consecutive_same_status
    description: >
      Two consecutive StatusNotifications with the same status for the same
      connector should produce only one row. The second is collapsed by the
      change_from_lag filter (previous_status == status).
    model: int_status_changes
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int_ocpp_logs')
        rows:
          # from_timestamp = greatest(start_processing_date, min(ingested_timestamp)),
          # then filtered with a strict `>` - without a row earlier than the first
          # real event, min(ingested_timestamp) becomes that event's own timestamp
          # and the boundary filter excludes it.
          - {ingested_timestamp: 2025-10-01 09:59:00}
          - {ingested_timestamp: 2025-10-01 10:00:00, charger_id: 'CH-001', connector_id: '1', action: 'StatusNotification', message_type_id: '2', unique_id: 'UID-001', payload: '{"connectorId": 1, "errorCode": "NoError", "status": "Available"}'}
          - {ingested_timestamp: 2025-10-01 10:30:00, charger_id: 'CH-001', connector_id: '1', action: 'StatusNotification', message_type_id: '2', unique_id: 'UID-002', payload: '{"connectorId": 1, "errorCode": "NoError", "status": "Available"}'}
    expect:
      rows:
        - {charger_id: 'CH-001', connector_id: '1', status: 'Available', previous_status: null, next_status: null}

  - name: test_status_changes_lag_lead_populated_correctly
    description: >
      Three status transitions (Available → Preparing → Charging) should produce
      three rows with correct previous_status and next_status on each row.
    model: int_status_changes
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int_ocpp_logs')
        rows:
          # See test_status_changes_deduplicates_consecutive_same_status for why
          # this earlier stub row is required (from_timestamp boundary exclusion).
          - {ingested_timestamp: 2025-10-01 09:59:00}
          - {ingested_timestamp: 2025-10-01 10:00:00, charger_id: 'CH-001', connector_id: '1', action: 'StatusNotification', message_type_id: '2', unique_id: 'UID-001', payload: '{"connectorId": 1, "errorCode": "NoError", "status": "Available"}'}
          - {ingested_timestamp: 2025-10-01 10:05:00, charger_id: 'CH-001', connector_id: '1', action: 'StatusNotification', message_type_id: '2', unique_id: 'UID-002', payload: '{"connectorId": 1, "errorCode": "NoError", "status": "Preparing"}'}
          - {ingested_timestamp: 2025-10-01 10:10:00, charger_id: 'CH-001', connector_id: '1', action: 'StatusNotification', message_type_id: '2', unique_id: 'UID-003', payload: '{"connectorId": 1, "errorCode": "NoError", "status": "Charging"}'}
    expect:
      rows:
        - {status: 'Available',  previous_status: null,        next_status: 'Preparing'}
        - {status: 'Preparing',  previous_status: 'Available', next_status: 'Charging'}
        - {status: 'Charging',   previous_status: 'Preparing', next_status: null}

  - name: test_status_changes_incremental_buffer_restores_previous_status
    description: >
      In incremental mode, rows from the buffer window (previous run, next_status=null)
      are pulled back so that the new run can compute previous_status for events
      that arrive right after the run boundary.
    model: int_status_changes
    overrides:
      macros:
        is_incremental: true
    given:
      - input: this
        rows:
          - {charger_id: 'CH-001', connector_id: '1', ingested_ts: 2025-10-01 09:45:00, unique_id: 'UID-000', status: 'Available', next_status: null, incremental_ts: 2025-10-01 10:00:00}
      - input: ref('int_ocpp_logs')
        rows:
          - {ingested_timestamp: 2025-10-01 10:05:00, charger_id: 'CH-001', connector_id: '1', action: 'StatusNotification', message_type_id: '2', unique_id: 'UID-001', payload: '{"connectorId": 1, "errorCode": "NoError", "status": "Preparing"}'}
    expect:
      rows:
        - {status: 'Available', previous_status: null,        next_status: 'Preparing'}
        - {status: 'Preparing', previous_status: 'Available', next_status: null}

  - name: test_status_changes_buffer_captures_event_within_30_min_window
    description: >
      from_timestamp (the table-wide max incremental_ts) is 2025-10-01 10:00:00, so
      buffer_from_timestamp is 09:30:00. A buffered row with next_status=null whose
      own ingested_ts (09:45:00) falls inside that 30-minute lookback is pulled back
      into scope and correctly gets next_status/next_ingested_ts populated from the
      new event.
    model: int_status_changes
    overrides:
      macros:
        is_incremental: true
    given:
      - input: this
        rows:
          - {charger_id: 'CH-001', connector_id: '1', ingested_ts: 2025-10-01 09:45:00, unique_id: 'UID-000', status: 'Available', next_status: null, incremental_ts: 2025-10-01 10:00:00}
      - input: ref('int_ocpp_logs')
        rows:
          - {ingested_timestamp: 2025-10-01 10:05:00, charger_id: 'CH-001', connector_id: '1', action: 'StatusNotification', message_type_id: '2', unique_id: 'UID-001', payload: '{"connectorId": 1, "errorCode": "NoError", "status": "Preparing"}'}
    expect:
      rows:
        - {status: 'Available', previous_status: null,        next_status: 'Preparing'}
        - {status: 'Preparing', previous_status: 'Available', next_status: null}

  - name: test_status_changes_buffer_ignores_event_outside_30_min_window
    description: >
      Same from_timestamp/buffer_from_timestamp as the within-window test (10:00:00 /
      09:30:00), but the buffered row's own ingested_ts (09:20:00) falls outside that
      30-minute lookback. It is never pulled back into scope, so the new event has no
      visibility into it and gets previous_status=null instead of 'Available' - the
      buffered row is silently left unmerged for this run.
    model: int_status_changes
    overrides:
      macros:
        is_incremental: true
    given:
      - input: this
        rows:
          - {charger_id: 'CH-001', connector_id: '1', ingested_ts: 2025-10-01 09:20:00, unique_id: 'UID-000', status: 'Available', next_status: null, incremental_ts: 2025-10-01 10:00:00}
      - input: ref('int_ocpp_logs')
        rows:
          - {ingested_timestamp: 2025-10-01 10:05:00, charger_id: 'CH-001', connector_id: '1', action: 'StatusNotification', message_type_id: '2', unique_id: 'UID-001', payload: '{"connectorId": 1, "errorCode": "NoError", "status": "Preparing"}'}
    expect:
      rows:
        - {status: 'Preparing', previous_status: null, next_status: null}

  # ── int_faulted_outages ─────────────────────────────────────────────────────

  - name: test_faulted_outages_partial_fault_produces_no_outage
    description: >
      When only one of two connectors on a port is faulted, the port should NOT
      be considered in a faulted outage. All connectors must be faulted.
    model: int_faulted_outages
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int_status_changes')
        rows:
          - {charger_id: 'CH-001', port_id: 'PORT-001', connector_id: '1', ingested_ts: 2025-10-01 10:00:00, status: 'Faulted',   next_status: null, next_ingested_ts: 2025-10-01 11:00:00, incremental_ts: 2025-10-01 12:00:00}
          - {charger_id: 'CH-001', port_id: 'PORT-001', connector_id: '2', ingested_ts: 2025-10-01 10:00:00, status: 'Available', next_status: null, next_ingested_ts: null,               incremental_ts: 2025-10-01 12:00:00}
      - input: ref('int_ports')
        rows:
          - {charger_id: 'CH-001', port_id: 'PORT-001', connector_count: 2}
    expect:
      rows: []

  - name: test_faulted_outages_all_connectors_faulted_produces_outage
    description: >
      When all connectors on a port are simultaneously faulted, a faulted outage
      row should be emitted covering the overlapping fault window.
    model: int_faulted_outages
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int_status_changes')
        rows:
          - {charger_id: 'CH-001', port_id: 'PORT-001', connector_id: '1', ingested_ts: 2025-10-01 10:00:00, status: 'Faulted', next_status: null, next_ingested_ts: 2025-10-01 11:00:00, incremental_ts: 2025-10-01 12:00:00}
          - {charger_id: 'CH-001', port_id: 'PORT-001', connector_id: '2', ingested_ts: 2025-10-01 10:00:00, status: 'Faulted', next_status: null, next_ingested_ts: 2025-10-01 11:00:00, incremental_ts: 2025-10-01 12:00:00}
      - input: ref('int_ports')
        rows:
          - {charger_id: 'CH-001', port_id: 'PORT-001', connector_count: 2}
    expect:
      rows:
        - {charger_id: 'CH-001', port_id: 'PORT-001', from_ts: '2025-10-01 10:00:00', to_ts: '2025-10-01 11:00:00', duration_minutes: 60}

  - name: test_faulted_outages_adjacent_periods_merged
    description: >
      Two adjacent all-connector-faulted intervals (where to_ts of first equals
      from_ts of second) should be merged into a single outage row.
    model: int_faulted_outages
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int_status_changes')
        rows:
          - {charger_id: 'CH-001', port_id: 'PORT-001', connector_id: '1', ingested_ts: 2025-10-01 10:00:00, status: 'Faulted', next_status: null, next_ingested_ts: 2025-10-01 11:00:00, incremental_ts: 2025-10-01 12:00:00}
          - {charger_id: 'CH-001', port_id: 'PORT-001', connector_id: '1', ingested_ts: 2025-10-01 11:00:00, status: 'Faulted', next_status: null, next_ingested_ts: 2025-10-01 12:00:00, incremental_ts: 2025-10-01 12:00:00}
      - input: ref('int_ports')
        rows:
          - {charger_id: 'CH-001', port_id: 'PORT-001', connector_count: 1}
    expect:
      rows:
        - {charger_id: 'CH-001', port_id: 'PORT-001', from_ts: '2025-10-01 10:00:00', to_ts: '2025-10-01 12:00:00', duration_minutes: 120}

  # ── int_offline_outages ─────────────────────────────────────────────────────

  - name: test_offline_outages_gap_above_threshold_produces_outage
    description: >
      A 90-minute silence between two CALL messages exceeds the 300-second
      heartbeat threshold and should produce one offline outage row.
    model: int_offline_outages
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_ocpp_logs')
        rows:
          - {ingested_timestamp: 2025-10-01 10:00:00, charger_id: 'CH-001', action: 'Heartbeat', message_type_id: '2'}
          - {ingested_timestamp: 2025-10-01 11:30:00, charger_id: 'CH-001', action: 'Heartbeat', message_type_id: '2'}
      - input: ref('int_chargers')
        rows:
          - {charger_id: 'CH-001', location_id: 'LOC-001', commissioned_ts: 2025-10-01 09:59:00, decommissioned_ts: 2025-10-01 11:30:00}
    expect:
      rows:
        - {charger_id: 'CH-001', from_ts: '2025-10-01 10:00:00', to_ts: '2025-10-01 11:30:00'}

  - name: test_offline_outages_gap_below_threshold_produces_no_outage
    description: >
      A 4-minute gap between messages (240 s < 300 s threshold) should not
      produce any outage row.
    model: int_offline_outages
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_ocpp_logs')
        rows:
          - {ingested_timestamp: 2025-10-01 10:00:00, charger_id: 'CH-001', action: 'Heartbeat', message_type_id: '2'}
          - {ingested_timestamp: 2025-10-01 10:04:00, charger_id: 'CH-001', action: 'Heartbeat', message_type_id: '2'}
      - input: ref('int_chargers')
        rows:
          - {charger_id: 'CH-001', location_id: 'LOC-001', commissioned_ts: 2025-10-01 09:59:00, decommissioned_ts: 2025-10-01 10:04:00}
    expect:
      rows: []

  - name: test_offline_outages_charger_with_no_messages_is_fully_offline
    description: >
      A commissioned charger that sends no messages during its monitoring window
      should produce a single outage covering the full window.
    model: int_offline_outages
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_ocpp_logs')
        rows:
          - {ingested_timestamp: 2025-10-01 13:00:00, charger_id: 'CH-002', action: 'Heartbeat', message_type_id: '2'}
      - input: ref('int_chargers')
        rows:
          - {charger_id: 'CH-001', location_id: 'LOC-001', commissioned_ts: 2025-10-01 10:00:00, decommissioned_ts: 2025-10-01 12:00:00}
    expect:
      rows:
        - {charger_id: 'CH-001', from_ts: '2025-10-01 10:00:00', to_ts: '2025-10-01 12:00:00'}

  - name: test_offline_outages_incremental_merge_extends_boundary_outage
    description: >
      An outage that ended at exactly the previous run boundary (to_ts = from_timestamp)
      should be merged with a new outage that starts at the same point, producing
      a single extended outage row.
    model: int_offline_outages
    overrides:
      macros:
        is_incremental: true
    given:
      - input: this
        rows:
          - {charger_id: 'CH-001', from_ts: 2025-10-01 09:00:00, to_ts: 2025-10-01 10:00:00, duration_minutes: 60, incremental_ts: 2025-10-01 10:00:00}
      - input: ref('stg_ocpp_logs')
        rows:
          - {ingested_timestamp: 2025-10-01 10:30:00, charger_id: 'CH-001', action: 'Heartbeat', message_type_id: '2'}
      - input: ref('int_chargers')
        rows:
          - {charger_id: 'CH-001', location_id: 'LOC-001', commissioned_ts: 2025-10-01 09:00:00, decommissioned_ts: null}
    expect:
      rows:
        - {charger_id: 'CH-001', from_ts: '2025-10-01 09:00:00', to_ts: '2025-10-01 10:30:00'}

  # ── int_connector_preparing ─────────────────────────────────────────────────

  - name: test_connector_preparing_incremental_merge_updates_next_status
    description: >
      In incremental mode, a buffered Preparing row whose next_status is null
      should be updated when the new run's int_status_changes now contains the
      subsequent status transition. Also verifies that once next_ingested_ts
      becomes known, event chaining (preparing_events_chaining) picks up a
      StartTransaction + confirmation pair that falls within the newly-known
      (ingested_ts, next_ingested_ts] window, and transaction_id gets populated
      from it - not just next_status/incremental_ts. And that updated_ts (this
      model's own per-row "last touched" signal, distinct from incremental_ts)
      advances from the buffered to greatest() of the buffered value and this 
      run's newly-known next_ingested_ts.
    model: int_connector_preparing
    overrides:
      macros:
        is_incremental: true
    given:
      - input: this
        format: dict
        rows:
          - {
              charger_id: 'CH-001',
              connector_id: '1',
              unique_id: 'UID-001',
              ingested_ts: 2025-10-01 10:00:00,
              status: 'Preparing',
              next_status: null,
              next_ingested_ts: null,
              incremental_ts: 2025-10-01 10:00:00,
              updated_ts: 2025-10-01 10:00:00,
            }
      - input: ref('int_status_changes')
        format: dict
        rows:
          - {
              charger_id: 'CH-001',
              connector_id: '1',
              unique_id: 'UID-001',
              ingested_ts: 2025-10-01 10:00:00,
              status: 'Preparing',
              next_status: 'Charging',
              next_ingested_ts: 2025-10-01 10:10:00,
              incremental_ts: 2025-10-01 10:10:00,
              updated_ts: 2025-10-01 10:10:00,
            }
      - input: ref('int_ocpp_logs')
        format: dict
        rows:
          # StartTransaction request, falling inside the (ingested_ts, next_ingested_ts]
          # window that only becomes valid this run, now that next_ingested_ts is known.
          - {
              charger_id: 'CH-001',
              connector_id: '1',
              action: 'StartTransaction',
              ingested_timestamp: 2025-10-01 10:00:05,
              message_type_id: '2',
              unique_id: 'start-001',
              payload: '{}',
            }
          # Its CALLRESULT confirmation, carrying the transactionId.
          - {
              charger_id: 'CH-001',
              ingested_timestamp: 2025-10-01 10:00:06,
              message_type_id: '3',
              unique_id: 'start-001',
              payload: '{"transactionId": 1001}',
            }
    expect:
      rows:
        - {
            charger_id: 'CH-001',
            connector_id: '1',
            status: 'Preparing',
            next_status: 'Charging',
            incremental_ts: '2025-10-01 10:10:00',
            updated_ts: '2025-10-01 10:10:00',
            transaction_id: '1001',
            _unique_transaction_count: 1,
          }

  - name: test_connector_preparing_buffer_captures_event_within_30_min_window
    description: >
      from_timestamp (the buffered row's own incremental_ts - the table-wide max as
      of the last run) is 10:00:00, so buffer_from_timestamp is 09:30:00. The buffered
      Preparing row's own ingested_ts (09:45:00, when it actually happened) falls
      inside that 30-minute lookback, so status_changes_to_preparing re-scans it and
      the buffer-merge correctly picks up its now-known next_status.
    model: int_connector_preparing
    overrides:
      macros:
        is_incremental: true
    given:
      - input: this
        rows:
          - {charger_id: 'CH-001', connector_id: '1', unique_id: 'UID-001', ingested_ts: 2025-10-01 09:45:00, status: 'Preparing', next_status: null, incremental_ts: 2025-10-01 10:00:00}
      - input: ref('int_status_changes')
        rows:
          - {charger_id: 'CH-001', connector_id: '1', unique_id: 'UID-001', ingested_ts: 2025-10-01 09:45:00, status: 'Preparing', next_status: 'Charging', next_ingested_ts: 2025-10-01 09:55:00, incremental_ts: 2025-10-01 09:55:00}
      - input: ref('int_ocpp_logs')
        rows:
          # Only needed so the model's own least()-bounded to_timestamp has a
          # non-null max(ingested_timestamp) to read from this source too.
          - {ingested_timestamp: 2025-10-01 09:55:00}
    expect:
      rows:
        - {charger_id: 'CH-001', connector_id: '1', status: 'Preparing', next_status: 'Charging'}

  - name: test_connector_preparing_buffer_ignores_event_outside_30_min_window
    description: >
      Same from_timestamp/buffer_from_timestamp as the within-window test (10:00:00 /
      09:30:00), but the buffered Preparing row's own ingested_ts (09:20:00) falls
      outside that 30-minute lookback. status_changes_to_preparing never re-scans it,
      so this run produces no output row at all for it - not updated, not duplicated,
      just silently left as-is in the underlying table.
    model: int_connector_preparing
    overrides:
      macros:
        is_incremental: true
    given:
      - input: this
        rows:
          - {charger_id: 'CH-001', connector_id: '1', unique_id: 'UID-001', ingested_ts: 2025-10-01 09:20:00, status: 'Preparing', next_status: null, incremental_ts: 2025-10-01 10:00:00}
      - input: ref('int_status_changes')
        rows:
          - {charger_id: 'CH-001', connector_id: '1', unique_id: 'UID-001', ingested_ts: 2025-10-01 09:20:00, status: 'Preparing', next_status: 'Charging', next_ingested_ts: 2025-10-01 09:30:00, incremental_ts: 2025-10-01 09:30:00}
      - input: ref('int_ocpp_logs')
        rows:
          # Only needed so the model's own least()-bounded to_timestamp has a
          # non-null max(ingested_timestamp) to read from this source too.
          - {ingested_timestamp: 2025-10-01 09:30:00}
    expect:
      rows: []

  # ── int_transactions ────────────────────────────────────────────────────────

  - name: test_transactions_incremental_ts_advances_on_transaction_completion
    description: >
      incremental_ts is max(ingested_ts) over ALL raw ocpp_logs scanned this run
      (unlike int_connector_preparing, this scan isn't pre-filtered to one action
      type), so it correctly advances to the StopTransaction event's own timestamp
      even though the transaction row's own ingested_ts (min() across its events)
      stays anchored to the StartTransaction time. updated_ts (this model's own
      per-row "last touched" signal, distinct from incremental_ts) also advances,
      from the buffered 10:01:00 to 10:29:00 - greatest() of the buffered value
      and this run's newest event (the StopTransaction itself).
    model: int_transactions
    overrides:
      macros:
        is_incremental: true
    given:
      - input: this
        rows:
          - {charger_id: 'CH-001', transaction_id: 'TXN-001', transaction_stop_ts: null, meter_start_wh: 1000, incremental_ts: 2025-10-01 10:01:00, updated_ts: 2025-10-01 10:01:00}
      - input: ref('int_ocpp_logs')
        rows:
          - {charger_id: 'CH-001', action: 'StopTransaction', ingested_timestamp: 2025-10-01 10:29:00, message_type_id: '2', unique_id: 'UID-100', payload: '{"transactionId": "TXN-001", "timestamp": "2025-10-01 10:29:00", "meterStop": 6000, "reason": "Local"}'}
      - input: ref('int_connectors')
        rows: []
      - input: ref('int_chargers')
        rows: []
    expect:
      rows:
        - {
            transaction_id: 'TXN-001',
            transaction_stop_ts: '2025-10-01 10:29:00',
            transaction_stop_reason: 'Local',
            meter_stop_wh: 6000,
            incremental_ts: '2025-10-01 10:29:00',
            updated_ts: '2025-10-01 10:29:00',
          }

  # ── int_connector_latest_status ─────────────────────────────────────────────

  - name: test_connector_latest_status_retains_record_when_no_new_events
    description: >
      When a batch contains no status updates for connector X, the model should
      produce no output row for X so that the merge strategy leaves X's existing
      record in {{ this }} untouched.
    model: int_connector_latest_status
    overrides:
      macros:
        is_incremental: true
    given:
      - input: this
        rows:
          - {charger_id: 'CH-001', connector_id: '1', port_id: 'P-001', latest_status: 'Available', latest_error_code: 'NoError', latest_status_ts: 2025-10-02 09:00:00, incremental_ts: 2025-10-02 10:00:00}
      - input: ref('int_status_changes')
        rows:
          - {charger_id: 'CH-002', connector_id: '1', port_id: 'P-002', ingested_ts: 2025-10-02 10:30:00, status: 'Charging', error_code: 'NoError', next_status: null}
    expect:
      rows:
        - {charger_id: 'CH-002', connector_id: '1', port_id: 'P-002', latest_status: 'Charging'}
