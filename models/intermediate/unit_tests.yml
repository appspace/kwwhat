version: 2

unit_tests:

  # ── int_driver_aggregates ───────────────────────────────────────────────────

  - name: test_int_driver_aggregates_late_arriving_event_updates_first_seen
    description: "A late-arriving event with an earlier charge_attempt_start_ts must overwrite first_seen_ts and first_authorization_status."
    model: int_driver_aggregates
    overrides:
      macros:
        is_incremental: true
      vars:
        start_processing_date: '2025-10-01 00:00:00'
    given:
      - input: this
        format: dict
        rows:
          - {id_tag: 'TAG-001', first_seen_ts: 2025-10-02 11:00:00, last_seen_ts: 2025-10-02 12:00:00, first_authorization_status: 'Accepted', latest_authorization_status: 'Blocked', incremental_ts: 2025-10-02 12:00:00}
      - input: ref('fact_charge_attempts')
        format: dict
        rows:
          - {id_tag: 'TAG-001', id_tag_status: 'Invalid', charge_attempt_start_ts: 2025-10-02 09:00:00, incremental_ts: 2025-10-02 13:00:00}
    expect:
      rows:
        - {id_tag: 'TAG-001', first_seen_ts: 2025-10-02 09:00:00, last_seen_ts: 2025-10-02 12:00:00, first_authorization_status: 'Invalid', latest_authorization_status: 'Blocked'}

  - name: test_int_driver_aggregates_new_latest_event_updates_last_seen
    description: "A new event with a later charge_attempt_start_ts must overwrite last_seen_ts and latest_authorization_status."
    model: int_driver_aggregates
    overrides:
      macros:
        is_incremental: true
      vars:
        start_processing_date: '2025-10-01 00:00:00'
    given:
      - input: this
        format: dict
        rows:
          - {id_tag: 'TAG-001', first_seen_ts: 2025-10-02 11:00:00, last_seen_ts: 2025-10-02 12:00:00, first_authorization_status: 'Accepted', latest_authorization_status: 'Accepted', incremental_ts: 2025-10-02 12:00:00}
      - input: ref('fact_charge_attempts')
        format: dict
        rows:
          - {id_tag: 'TAG-001', id_tag_status: 'Blocked', charge_attempt_start_ts: 2025-10-02 14:00:00, incremental_ts: 2025-10-02 15:00:00}
    expect:
      rows:
        - {id_tag: 'TAG-001', first_seen_ts: 2025-10-02 11:00:00, last_seen_ts: 2025-10-02 14:00:00, first_authorization_status: 'Accepted', latest_authorization_status: 'Blocked'}

  - name: test_int_driver_aggregates_unknown_sentinel_accumulates_incremental
    description: "Null id_tag rows aggregate under __UNKNOWN__ and merge correctly with the existing sentinel on incremental runs."
    model: int_driver_aggregates
    overrides:
      macros:
        is_incremental: true
      vars:
        start_processing_date: '2025-10-01 00:00:00'
    given:
      - input: this
        format: dict
        rows:
          - {id_tag: '__UNKNOWN__', first_seen_ts: 2025-10-02 08:00:00, last_seen_ts: 2025-10-02 09:00:00, first_authorization_status: null, latest_authorization_status: null, incremental_ts: 2025-10-02 09:00:00}
      - input: ref('fact_charge_attempts')
        format: dict
        rows:
          - {id_tag: null, id_tag_status: null, charge_attempt_start_ts: 2025-10-02 07:00:00, incremental_ts: 2025-10-02 13:00:00}
    expect:
      rows:
        - {id_tag: '__UNKNOWN__', first_seen_ts: 2025-10-02 07:00:00, last_seen_ts: 2025-10-02 09:00:00, first_authorization_status: null, latest_authorization_status: null}

  # ── int_status_changes ──────────────────────────────────────────────────────

  - name: test_status_changes_deduplicates_consecutive_same_status
    description: >
      Two consecutive StatusNotifications with the same status for the same
      connector should produce only one row. The second is collapsed by the
      change_from_lag filter (previous_status == status).
    model: int_status_changes
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int_ocpp_logs')
        rows:
          # from_timestamp = greatest(start_processing_date, min(ingested_timestamp)),
          # then filtered with a strict `>` - without a row earlier than the first
          # real event, min(ingested_timestamp) becomes that event's own timestamp
          # and the boundary filter excludes it.
          - {ingested_timestamp: 2025-10-01 09:59:00}
          - {ingested_timestamp: 2025-10-01 10:00:00, charger_id: 'CH-001', connector_id: '1', action: 'StatusNotification', message_type_id: '2', unique_id: 'UID-001', payload: '{"connectorId": 1, "errorCode": "NoError", "status": "Available"}'}
          - {ingested_timestamp: 2025-10-01 10:30:00, charger_id: 'CH-001', connector_id: '1', action: 'StatusNotification', message_type_id: '2', unique_id: 'UID-002', payload: '{"connectorId": 1, "errorCode": "NoError", "status": "Available"}'}
    expect:
      rows:
        - {charger_id: 'CH-001', connector_id: '1', status: 'Available', previous_status: null, next_status: null}

  - name: test_status_changes_extracts_chargex_vendor_error_code
    description: >
      A StatusNotification carrying a ChargeX MREC fault code in vendorErrorCode
      (e.g. 'CX003' for HighTemperature) should have it extracted into
      error_code, alongside the standard OCPP errorCode (error_code_name), the vendorId (taxonomy)
      ('https://chargex.inl.gov') that scopes how to decode it, and the info field
      (the actual observed value, e.g. '50'). A StatusNotification without
      vendorErrorCode/vendorId/info fields should leave all three null.
    model: int_status_changes
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int_ocpp_logs')
        rows:
          - {ingested_timestamp: 2025-10-01 09:59:00, charger_id: 'CH-001', connector_id: null, port_id: null, location_id: null, action: 'Heartbeat', message_type_id: '2', unique_id: 'UID-000', payload: '{}'}
          - {ingested_timestamp: 2025-10-01 10:00:00, charger_id: 'CH-001', connector_id: '1', port_id: 'PORT-001', location_id: 'LOC-001', action: 'StatusNotification', message_type_id: '2', unique_id: 'UID-001', payload: '{"connectorId": 1, "errorCode": "HighTemperature", "info": "50", "status": "Faulted", "vendorId": "https://chargex.inl.gov", "vendorErrorCode": "CX003"}'}
          - {ingested_timestamp: 2025-10-01 10:05:00, charger_id: 'CH-001', connector_id: '2', port_id: 'PORT-002', location_id: 'LOC-001', action: 'StatusNotification', message_type_id: '2', unique_id: 'UID-002', payload: '{"connectorId": 2, "errorCode": "NoError", "status": "Available"}'}
    expect:
      rows:
        - {connector_id: '1', status: 'Faulted', error_code_name: 'HighTemperature', error_code: 'CX003', taxonomy: 'https://chargex.inl.gov', info: '50'}
        - {connector_id: '2', status: 'Available', error_code_name: 'NoError', error_code: null, taxonomy: null, info: null}

  - name: test_status_changes_lag_lead_populated_correctly
    description: >
      Three status transitions (Available → Preparing → Charging) should produce
      three rows with correct previous_status and next_status on each row.
    model: int_status_changes
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int_ocpp_logs')
        rows:
          # See test_status_changes_deduplicates_consecutive_same_status for why
          # this earlier stub row is required (from_timestamp boundary exclusion).
          - {ingested_timestamp: 2025-10-01 09:59:00}
          - {ingested_timestamp: 2025-10-01 10:00:00, charger_id: 'CH-001', connector_id: '1', action: 'StatusNotification', message_type_id: '2', unique_id: 'UID-001', payload: '{"connectorId": 1, "errorCode": "NoError", "status": "Available"}'}
          - {ingested_timestamp: 2025-10-01 10:05:00, charger_id: 'CH-001', connector_id: '1', action: 'StatusNotification', message_type_id: '2', unique_id: 'UID-002', payload: '{"connectorId": 1, "errorCode": "NoError", "status": "Preparing"}'}
          - {ingested_timestamp: 2025-10-01 10:10:00, charger_id: 'CH-001', connector_id: '1', action: 'StatusNotification', message_type_id: '2', unique_id: 'UID-003', payload: '{"connectorId": 1, "errorCode": "NoError", "status": "Charging"}'}
    expect:
      rows:
        - {status: 'Available',  previous_status: null,        next_status: 'Preparing'}
        - {status: 'Preparing',  previous_status: 'Available', next_status: 'Charging'}
        - {status: 'Charging',   previous_status: 'Preparing', next_status: null}

  - name: test_status_changes_incremental_buffer_restores_previous_status
    description: >
      In incremental mode, rows from the buffer window (previous run, next_status=null)
      are pulled back so that the new run can compute previous_status for events
      that arrive right after the run boundary.
    model: int_status_changes
    overrides:
      macros:
        is_incremental: true
    given:
      - input: this
        rows:
          - {charger_id: 'CH-001', connector_id: '1', ingested_ts: 2025-10-01 09:45:00, unique_id: 'UID-000', status: 'Available', next_status: null, incremental_ts: 2025-10-01 10:00:00}
      - input: ref('int_ocpp_logs')
        rows:
          - {ingested_timestamp: 2025-10-01 10:05:00, charger_id: 'CH-001', connector_id: '1', action: 'StatusNotification', message_type_id: '2', unique_id: 'UID-001', payload: '{"connectorId": 1, "errorCode": "NoError", "status": "Preparing"}'}
    expect:
      rows:
        - {status: 'Available', previous_status: null,        next_status: 'Preparing'}
        - {status: 'Preparing', previous_status: 'Available', next_status: null}

  - name: test_status_changes_buffer_captures_event_within_30_min_window
    description: >
      from_timestamp (the table-wide max incremental_ts) is 2025-10-01 10:00:00, so
      buffer_from_timestamp is 09:30:00. A buffered row with next_status=null whose
      own ingested_ts (09:45:00) falls inside that 30-minute lookback is pulled back
      into scope and correctly gets next_status/next_ingested_ts populated from the
      new event.
    model: int_status_changes
    overrides:
      macros:
        is_incremental: true
    given:
      - input: this
        rows:
          - {charger_id: 'CH-001', connector_id: '1', ingested_ts: 2025-10-01 09:45:00, unique_id: 'UID-000', status: 'Available', next_status: null, incremental_ts: 2025-10-01 10:00:00}
      - input: ref('int_ocpp_logs')
        rows:
          - {ingested_timestamp: 2025-10-01 10:05:00, charger_id: 'CH-001', connector_id: '1', action: 'StatusNotification', message_type_id: '2', unique_id: 'UID-001', payload: '{"connectorId": 1, "errorCode": "NoError", "status": "Preparing"}'}
    expect:
      rows:
        - {status: 'Available', previous_status: null,        next_status: 'Preparing'}
        - {status: 'Preparing', previous_status: 'Available', next_status: null}

  - name: test_status_changes_buffer_closes_open_status_older_than_30_min
    description: >
      Same from_timestamp/buffer_from_timestamp as the within-window test (10:00:00 /
      09:30:00), but the buffered row's own ingested_ts (09:20:00) falls outside that
      30-minute lookback. It is never pulled back into scope, so the new event has no
      visibility into it and gets previous_status=null instead of 'Available' - the
      buffered row is silently left unmerged for this run.
    model: int_status_changes
    overrides:
      macros:
        is_incremental: true
    given:
      - input: this
        rows:
          - {charger_id: 'CH-001', connector_id: '1', ingested_ts: 2025-10-01 09:20:00, unique_id: 'UID-000', status: 'Available', next_status: null, incremental_ts: 2025-10-01 10:00:00}
      - input: ref('int_ocpp_logs')
        rows:
          - {ingested_timestamp: 2025-10-01 10:05:00, charger_id: 'CH-001', connector_id: '1', action: 'StatusNotification', message_type_id: '2', unique_id: 'UID-001', payload: '{"connectorId": 1, "errorCode": "NoError", "status": "Preparing"}'}
    expect:
      rows:
        - {status: 'Available', previous_status: null,        next_status: 'Preparing'}
        - {status: 'Preparing', previous_status: 'Available', next_status: null}

  - name: test_status_changes_run_with_no_new_logs_writes_nothing
    description: >
      Setup: the watermark is 10:00 and connector 1's latest status, Available at 09:45, is open. No new
      logs arrive in this run.
      Expected: nothing is written. The run has no incremental_ts, so writing the open status again would
      give it a null stamp that downstream filters never pick up.
    model: int_status_changes
    overrides:
      macros:
        is_incremental: true
    given:
      - input: this
        rows:
          - {charger_id: 'CH-001', connector_id: '1', ingested_ts: 2025-10-01 09:45:00, unique_id: 'UID-000', status: 'Available', next_status: null, incremental_ts: 2025-10-01 10:00:00}
      - input: ref('int_ocpp_logs')
        rows: []
    expect:
      rows: []

  # ── int_faulted_outages ─────────────────────────────────────────────────────

  - name: test_faulted_outages_partial_fault_produces_no_outage
    description: >
      When only one of two connectors on a port is faulted, the port should NOT
      be considered in a faulted outage. All connectors must be faulted.
    model: int_faulted_outages
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int_status_changes')
        rows:
          - {charger_id: 'CH-001', port_id: 'PORT-001', connector_id: '1', ingested_ts: 2025-10-01 10:00:00, status: 'Faulted',   next_status: null, next_ingested_ts: 2025-10-01 11:00:00, incremental_ts: 2025-10-01 12:00:00}
          - {charger_id: 'CH-001', port_id: 'PORT-001', connector_id: '2', ingested_ts: 2025-10-01 10:00:00, status: 'Available', next_status: null, next_ingested_ts: null,               incremental_ts: 2025-10-01 12:00:00}
      - input: ref('int_ports')
        rows:
          - {charger_id: 'CH-001', port_id: 'PORT-001', connector_count: 2}
      - input: ref('int_connectors')
        rows: []
      - input: ref('int_ocpp_logs')
        rows: []
    expect:
      rows: []

  - name: test_faulted_outages_all_connectors_faulted_produces_outage
    description: >
      When all connectors on a port are simultaneously faulted, a faulted outage
      row should be emitted covering the overlapping fault window.
    model: int_faulted_outages
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int_status_changes')
        rows:
          - {charger_id: 'CH-001', port_id: 'PORT-001', connector_id: '1', ingested_ts: 2025-10-01 10:00:00, status: 'Faulted', next_status: null, next_ingested_ts: 2025-10-01 11:00:00, incremental_ts: 2025-10-01 12:00:00}
          - {charger_id: 'CH-001', port_id: 'PORT-001', connector_id: '2', ingested_ts: 2025-10-01 10:00:00, status: 'Faulted', next_status: null, next_ingested_ts: 2025-10-01 11:00:00, incremental_ts: 2025-10-01 12:00:00}
      - input: ref('int_ports')
        rows:
          - {charger_id: 'CH-001', port_id: 'PORT-001', connector_count: 2}
      - input: ref('int_connectors')
        rows: []
      - input: ref('int_ocpp_logs')
        rows: []
    expect:
      rows:
        - {charger_id: 'CH-001', port_id: 'PORT-001', from_ts: '2025-10-01 10:00:00', to_ts: '2025-10-01 11:00:00', duration_minutes: 60}

  - name: test_faulted_outages_adjacent_periods_merged
    description: >
      Two adjacent all-connector-faulted intervals (where to_ts of first equals
      from_ts of second) should be merged into a single outage row.
    model: int_faulted_outages
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int_status_changes')
        rows:
          - {charger_id: 'CH-001', port_id: 'PORT-001', connector_id: '1', ingested_ts: 2025-10-01 10:00:00, status: 'Faulted', next_status: null, next_ingested_ts: 2025-10-01 11:00:00, incremental_ts: 2025-10-01 12:00:00}
          - {charger_id: 'CH-001', port_id: 'PORT-001', connector_id: '1', ingested_ts: 2025-10-01 11:00:00, status: 'Faulted', next_status: null, next_ingested_ts: 2025-10-01 12:00:00, incremental_ts: 2025-10-01 12:00:00}
      - input: ref('int_ports')
        rows:
          - {charger_id: 'CH-001', port_id: 'PORT-001', connector_count: 1}
      - input: ref('int_connectors')
        rows: []
      - input: ref('int_ocpp_logs')
        rows: []
    expect:
      rows:
        - {charger_id: 'CH-001', port_id: 'PORT-001', from_ts: '2025-10-01 10:00:00', to_ts: '2025-10-01 12:00:00', duration_minutes: 120}

  - name: test_faulted_outages_latest_root_cause_picks_most_recent_fault_period
    description: >
      When a merged outage spans two consecutive fault periods reporting different
      codes, latest_error_code_name/latest_error_code/latest_taxonomy should come
      from the fault period that started most recently, not an arbitrary one.
    model: int_faulted_outages
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int_status_changes')
        rows:
          - {charger_id: 'CH-001', port_id: 'PORT-001', connector_id: '1', ingested_ts: 2025-10-01 10:00:00, status: 'Faulted', error_code_name: 'OtherError',    error_code: 'CX003', taxonomy: 'https://chargex.inl.gov', next_status: null, next_ingested_ts: 2025-10-01 11:00:00, incremental_ts: 2025-10-01 12:00:00}
          - {charger_id: 'CH-001', port_id: 'PORT-001', connector_id: '1', ingested_ts: 2025-10-01 11:00:00, status: 'Faulted', error_code_name: 'GroundFailure', error_code: 'CX010', taxonomy: 'https://chargex.inl.gov', next_status: null, next_ingested_ts: 2025-10-01 12:00:00, incremental_ts: 2025-10-01 12:00:00}
      - input: ref('int_ports')
        rows:
          - {charger_id: 'CH-001', port_id: 'PORT-001', connector_count: 1}
      - input: ref('int_connectors')
        rows: []
      - input: ref('int_ocpp_logs')
        rows: []
    expect:
      rows:
        - {charger_id: 'CH-001', port_id: 'PORT-001', from_ts: '2025-10-01 10:00:00', to_ts: '2025-10-01 12:00:00', latest_error_code_name: 'GroundFailure', latest_error_code: 'CX010', latest_taxonomy: 'https://chargex.inl.gov'}

  - name: test_faulted_outages_ongoing_fault_ends_at_latest_status_change
    description: >
      Setup: connector 1 reports Faulted at 10:00 and nothing after it, so the fault is still ongoing.
      The latest status change loaded is stamped 12:00.
      Expected: the outage runs 10:00-12:00, ending at the latest data point, not at the end of the
      3-month processing window.
    model: int_faulted_outages
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int_status_changes')
        rows:
          - {charger_id: 'CH-001', port_id: 'PORT-001', connector_id: '1', ingested_ts: 2025-10-01 10:00:00, status: 'Faulted', next_status: null, next_ingested_ts: null, incremental_ts: 2025-10-01 12:00:00}
      - input: ref('int_ports')
        rows:
          - {charger_id: 'CH-001', port_id: 'PORT-001', connector_count: 1}
      - input: ref('int_connectors')
        rows: []
      - input: ref('int_ocpp_logs')
        rows: []
    expect:
      rows:
        - {charger_id: 'CH-001', port_id: 'PORT-001', from_ts: '2025-10-01 10:00:00', to_ts: '2025-10-01 12:00:00', duration_minutes: 120}

  - name: test_faulted_outages_ongoing_fault_ends_at_max_stamp_read_in_catch_up
    description: >
      Setup: catch-up full build. The 3-month window ends 2026-01-01, but int_status_changes goes on to
      2026-03-01, so the window end is not a stamp. Connector 1 reports Faulted at 10:00, still open,
      stamped 12:00, the max stamp read in the window.
      Expected: the outage runs 10:00-12:00 and is stamped 12:00, so the next run starts where it was
      cut off, instead of running to the window end.
    model: int_faulted_outages
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int_status_changes')
        rows:
          - {charger_id: 'CH-001', port_id: 'PORT-001', connector_id: '1', ingested_ts: 2025-10-01 10:00:00, status: 'Faulted', next_status: null, next_ingested_ts: null, incremental_ts: 2025-10-01 12:00:00}
          - {charger_id: 'CH-002', port_id: 'PORT-001', connector_id: '1', ingested_ts: 2026-03-01 00:00:00, status: 'Available', next_status: null, next_ingested_ts: null, incremental_ts: 2026-03-01 00:00:00}
      - input: ref('int_ports')
        rows:
          - {charger_id: 'CH-001', port_id: 'PORT-001', connector_count: 1}
      - input: ref('int_connectors')
        rows: []
      - input: ref('int_ocpp_logs')
        rows: []
    expect:
      rows:
        - {charger_id: 'CH-001', port_id: 'PORT-001', from_ts: '2025-10-01 10:00:00', to_ts: '2025-10-01 12:00:00', duration_minutes: 120, incremental_ts: '2025-10-01 12:00:00'}

  - name: test_faulted_outages_full_refresh_starts_where_status_changes_start
    description: >
      Setup: full refresh with a 6-day window. The first log arrives at 2025-10-01 08:00, so
      int_status_changes starts there and stamps its first batch 2025-10-07 08:00, the last log in
      its window. Connector 1 is Faulted from 08:11:07 to 08:12:37 on 10-01, in that batch.
      Expected: the fault is an outage. int_faulted_outages starts from the same point (the first
      log, not midnight), so its first window ends at the same time as the upstream's first batch.
    model: int_faulted_outages
    overrides:
      macros:
        is_incremental: false
      vars:
        incremental_window: {unit: 'day', length: 6}
    given:
      - input: ref('int_status_changes')
        rows:
          - {charger_id: 'CH-002', port_id: '1', connector_id: '1', ingested_ts: 2025-10-01 08:11:07, status: 'Faulted', next_status: 'Available', next_ingested_ts: 2025-10-01 08:12:37, incremental_ts: 2025-10-07 08:00:00}
      - input: ref('int_ports')
        rows:
          - {charger_id: 'CH-002', port_id: '1', connector_count: 1}
      - input: ref('int_connectors')
        rows: []
      - input: ref('int_ocpp_logs')
        rows:
          - {ingested_timestamp: 2025-10-01 08:00:00}
    expect:
      rows:
        - {charger_id: 'CH-002', port_id: '1', from_ts: '2025-10-01 08:11:07', to_ts: '2025-10-01 08:12:37'}

  - name: test_faulted_outages_incremental_reads_only_new_status_changes
    description: >
      Setup: the watermark in this is 12:00. A fault 08:00-09:00 was loaded by an earlier batch
      (stamped 09:00), and a new fault 14:00-15:00 arrives in this batch (stamped 15:00).
      Expected: only the new 14:00-15:00 outage, stamped 15:00 (the batch's max incremental_ts).
    model: int_faulted_outages
    overrides:
      macros:
        is_incremental: true
    given:
      - input: this
        rows:
          - {charger_id: 'CH-001', port_id: 'PORT-001', from_ts: 2025-10-01 08:00:00, to_ts: 2025-10-01 09:00:00, duration_minutes: 60, incremental_ts: 2025-10-01 12:00:00}
      - input: ref('int_status_changes')
        rows:
