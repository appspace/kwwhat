  # ── fact_downtime_daily ─────────────────────────────────────────────────────

  - name: test_downtime_daily_offline_excluded_during_faulted_outage
    description: >
      An offline outage whose from_ts falls inside an active faulted outage window
      should be excluded. Only the faulted outage row should appear in the output.
    model: fact_downtime_daily
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int_faulted_outages')
        format: sql
        rows: |
          select 'CH-001' as charger_id, 'PORT-001' as port_id, cast('2025-10-01 10:00:00' as timestamp) as from_ts, cast('2025-10-01 12:00:00' as timestamp) as to_ts, 120 as duration_minutes, cast('2025-10-01 12:00:00' as timestamp) as incremental_ts
      - input: ref('int_offline_outages')
        format: sql
        rows: |
          select 'CH-001' as charger_id, cast('2025-10-01 10:30:00' as timestamp) as from_ts, cast('2025-10-01 12:30:00' as timestamp) as to_ts, 120 as duration_minutes, cast('2025-10-01 12:30:00' as timestamp) as incremental_ts
      - input: ref('int_chargers')
        format: sql
        rows: |
          select 'CH-001' as charger_id, 'LOC-001' as location_id, cast('2025-01-01' as timestamp) as commissioned_ts, cast(null as timestamp) as decommissioned_ts, 1 as port_count
      - input: ref('int_ports')
        format: sql
        rows: |
          select 'CH-001' as charger_id, 'PORT-001' as port_id, 1 as connector_count
      - input: ref('dim_dates')
        format: sql
        rows: |
          select cast('2025-10-01' as date) as date_id, cast('2025-10-01' as date) as date_day
    expect:
      rows:
        - {charger_id: 'CH-001', port_id: 'PORT-001', reason: 'FAULTED', duration_minutes: 120}

  - name: test_downtime_daily_multi_day_outage_split_across_days
    description: >
      An outage spanning midnight (22:00 day 1 to 04:00 day 2) must produce two
      rows: 120 minutes on day 1 and 240 minutes on day 2.
    model: fact_downtime_daily
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int_faulted_outages')
        format: sql
        rows: |
          select cast(null as string) as charger_id, cast(null as string) as port_id, cast(null as timestamp) as from_ts, cast(null as timestamp) as to_ts, cast(null as bigint) as duration_minutes, cast(null as timestamp) as incremental_ts where false
      - input: ref('int_offline_outages')
        format: sql
        rows: |
          select 'CH-001' as charger_id, cast('2025-10-01 22:00:00' as timestamp) as from_ts, cast('2025-10-02 04:00:00' as timestamp) as to_ts, 360 as duration_minutes, cast('2025-10-02 12:00:00' as timestamp) as incremental_ts
      - input: ref('int_chargers')
        format: sql
        rows: |
          select 'CH-001' as charger_id, 'LOC-001' as location_id, cast('2025-01-01' as timestamp) as commissioned_ts, cast(null as timestamp) as decommissioned_ts, 1 as port_count
      - input: ref('int_ports')
        format: sql
        rows: |
          select 'CH-001' as charger_id, 'PORT-001' as port_id, 1 as connector_count
      - input: ref('dim_dates')
        format: sql
        rows: |
          select cast('2025-10-01' as date) as date_id, cast('2025-10-01' as date) as date_day
          union all
          select cast('2025-10-02' as date), cast('2025-10-02' as date)
    expect:
      rows:
        - {charger_id: 'CH-001', port_id: 'PORT-001', reason: 'OFFLINE', duration_minutes: 120}
        - {charger_id: 'CH-001', port_id: 'PORT-001', reason: 'OFFLINE', duration_minutes: 240}
